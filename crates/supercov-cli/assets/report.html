<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Supercov report</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f5f7;
      --panel: #ffffff;
      --panel-2: #f5f5f7;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(29, 29, 31, .11);
      --line-strong: rgba(29, 29, 31, .24);
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-2: #e8f2ff;
      --good: #16815b;
      --good-bg: #e8f7f0;
      --warn: #b95608;
      --warn-bg: #fff0e3;
      --bad: #c32929;
      --bad-bg: #ffecec;
      --info: #0071e3;
      --info-bg: #e8f2ff;
      --code-bg: #202022;
      --code-ink: #f5f5f7;
      --code-muted: #8e8e93;
      --code-line: rgba(255, 255, 255, .11);
      --code-selected: rgba(255, 149, 0, .22);
      --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 18px 46px rgba(0, 0, 0, .055);
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, .045);
      --radius: 24px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: "SF Pro Text", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #09090a;
      --panel: #202022;
      --panel-2: #29292c;
      --ink: #f5f5f7;
      --muted: #a1a1a6;
      --line: rgba(255, 255, 255, .11);
      --line-strong: rgba(255, 255, 255, .24);
      --accent: #2997ff;
      --accent-hover: #49a7ff;
      --accent-2: #172b40;
      --good: #65d7ac;
      --good-bg: #15372b;
      --warn: #ffad66;
      --warn-bg: #412718;
      --bad: #ff8585;
      --bad-bg: #402020;
      --info: #64b5ff;
      --info-bg: #172b40;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 20px 50px rgba(0, 0, 0, .26);
      --shadow-soft: 0 12px 34px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body { margin: 0; color: var(--ink); background: var(--bg); font-family: var(--sans); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent), transparent 35%); outline-offset: 2px; }
    .shell { max-width: 1480px; min-height: 100vh; margin: auto; padding: 0 34px 64px; }
    .topbar { position: sticky; top: 0; z-index: 20; min-height: 72px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg), transparent 14%); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
    .brand { display: flex; align-items: center; gap: 10px; min-width: max-content; font-family: var(--display); font-weight: 650; letter-spacing: -.025em; font-size: 19px; }
    .mark { width: 27px; height: 27px; display: block; flex: 0 0 auto; color: var(--ink); }
    .brand-name { margin-left: 1px; }
    .project { color: var(--muted); font-weight: 520; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-controls { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 1; min-width: 0; }
    select, input[type="search"] { min-height: 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 7px 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, .025); }
    select { max-width: 235px; }
    .icon-button, .button { min-height: 38px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 8px 13px; font-weight: 590; }
    .button:hover, .icon-button:hover { border-color: var(--line-strong); background: var(--panel-2); }
    .button.primary { color: white; border-color: var(--accent); background: var(--accent); }
    .button.primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
    .hero { padding: 42px 0 22px; }
    h1 { margin: 6px 0 5px; max-width: 920px; font-family: var(--display); font-size: clamp(31px, 4.2vw, 52px); font-weight: 650; line-height: 1.04; letter-spacing: -.048em; }
    .trust { display: flex; align-items: flex-start; gap: 14px; margin: 23px 0 18px; padding: 17px 19px; border: 1px solid var(--line); border-radius: 22px; background: var(--panel); box-shadow: var(--shadow-soft); }
    .trust.good, .trust.warn, .trust.bad { background: var(--panel); }
    .trust.good { border-color: color-mix(in srgb, var(--good), transparent 62%); }
    .trust.warn { border-color: color-mix(in srgb, var(--warn), transparent 62%); }
    .trust.bad { border-color: color-mix(in srgb, var(--bad), transparent 62%); }
    .trust-icon { width: 31px; height: 31px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; font-weight: 750; }
    .trust.good .trust-icon { color: var(--good); background: var(--good-bg); }
    .trust.warn .trust-icon { color: var(--warn); background: var(--warn-bg); }
    .trust.bad .trust-icon { color: var(--bad); background: var(--bad-bg); }
    .trust-title { font-size: 15px; font-weight: 760; }
    .trust-copy { color: var(--muted); margin-top: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--panel), transparent 16%); padding: 3px 8px; color: var(--muted); font-size: 12px; font-weight: 650; }
    .chip.good { color: var(--good); border-color: color-mix(in srgb, var(--good), transparent 55%); }
    .chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn), transparent 55%); }
    .chip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad), transparent 55%); }
    .metrics { display: grid; grid-template-columns: repeat(5, minmax(145px, 1fr)); gap: 12px; margin-bottom: 21px; }
    .metric { padding: 16px 17px; border: 1px solid var(--line); border-radius: 19px; background: var(--panel); box-shadow: var(--shadow-soft); }
    .metric-label { color: var(--muted); font-weight: 630; font-size: 12px; }
    .metric-value { margin-top: 3px; font-family: var(--display); font-size: 27px; line-height: 1.15; font-weight: 650; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .metric-count { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .bar { height: 3px; margin-top: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
    .bar > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .tabs { display: flex; width: max-content; max-width: 100%; gap: 3px; margin-bottom: 18px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--panel), transparent 8%); box-shadow: 0 1px 3px rgba(0, 0, 0, .035); }
    .tab { border: 0; border-radius: 999px; background: transparent; color: var(--muted); padding: 8px 15px; font-weight: 620; }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { color: white; background: var(--accent); box-shadow: 0 2px 8px color-mix(in srgb, var(--accent), transparent 72%); }
    .panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: var(--shadow); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
    .panel-title { font-family: var(--display); font-weight: 650; letter-spacing: -.012em; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .review-grid { display: grid; grid-template-columns: minmax(290px, 380px) minmax(0, 1fr); gap: 18px; }
    .gap-sidebar { min-height: 600px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 7px; padding: 11px; border-bottom: 1px solid var(--line); }
    .toolbar input { flex: 1; min-width: 140px; }
    .filter-row { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 11px 11px; border-bottom: 1px solid var(--line); }
    .filter { border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); padding: 4px 8px; font-size: 12px; }
    .filter[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-2); }
    .gap-list { max-height: 660px; overflow: auto; padding: 6px; }
    .gap-item { width: 100%; border: 1px solid transparent; border-radius: 13px; background: transparent; padding: 11px; text-align: left; }
    .gap-item:hover { background: var(--panel-2); }
    .gap-item[aria-current="true"] { border-color: color-mix(in srgb, var(--accent), transparent 58%); background: var(--accent-2); }
    .gap-path { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; font-weight: 690; }
    .gap-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .score { font-variant-numeric: tabular-nums; color: var(--warn); font-weight: 720; }
    .empty { padding: 38px 18px; text-align: center; color: var(--muted); }
    .detail { min-width: 0; overflow: hidden; }
    .detail-top { padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .detail-path { overflow-wrap: anywhere; font-family: var(--mono); font-weight: 730; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
    .section { padding: 15px 16px; border-bottom: 1px solid var(--line); }
    .section:last-child { border-bottom: 0; }
    .section h2, .section h3 { margin: 0 0 9px; font-size: 14px; }
    .gap-lines { display: flex; flex-wrap: wrap; gap: 6px; }
    .line-button { border: 1px solid var(--line); border-radius: 999px; background: var(--panel-2); padding: 5px 9px; font-family: var(--mono); font-size: 12px; }
    .line-button[aria-current="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-2); }
    .obligation { margin: 8px 0 0; padding: 11px 12px; border: 1px solid color-mix(in srgb, var(--warn), transparent 70%); border-radius: 13px; background: var(--warn-bg); }
    .obligation-title { font-weight: 720; }
    .obligation-copy { margin-top: 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .source-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 11px; }
    .source-head-copy { min-width: 0; display: grid; gap: 8px; }
    .source-legend { display: flex; flex-wrap: wrap; gap: 7px 15px; color: var(--faint); font-size: 10px; }
    .source-key { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .source-key-symbol { width: 10px; text-align: center; font-family: var(--mono); font-size: 12px; font-weight: 800; }
    .source-key-symbol.gap { color: var(--warn); }
    .source-key-symbol.covered { color: var(--good); }
    .source-key-symbol.missed { color: var(--bad); }
    .code { overflow: auto; max-height: 620px; border: 1px solid var(--code-line); border-radius: 18px; color: var(--code-ink); background: var(--code-bg); box-shadow: inset 0 1px rgba(255, 255, 255, .04), 0 14px 32px rgba(0, 0, 0, .12); font: 12px/1.65 var(--mono); }
    .code-row { display: grid; grid-template-columns: 55px 12px minmax(max-content, 1fr); min-height: 20px; }
    .code-row.selected { background: var(--code-selected); }
    .code-row.open-gap .code-state { color: var(--warn); }
    .code-row.covered .code-state { color: var(--good); }
    .code-row.uncovered .code-state { color: var(--bad); }
    .code-no { color: var(--code-muted); text-align: right; padding: 0 9px; border-right: 1px solid var(--code-line); user-select: none; }
    .code-state { text-align: center; font-weight: 800; }
    .code-text { padding: 0 11px; white-space: pre; tab-size: 2; }
    .decision { margin-top: 10px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .decision-head { padding: 10px 11px; background: var(--panel-2); font-family: var(--mono); font-size: 12px; }
    .decision-body { padding: 10px 11px; }
    .condition { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; }
    .status-dot { width: 9px; height: 9px; margin-top: 5px; flex: 0 0 auto; border-radius: 50%; background: var(--muted); }
    .status-dot.good { background: var(--good); }
    .status-dot.bad { background: var(--bad); }
    .vectors { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .vector { border: 1px solid var(--code-line); border-radius: 7px; color: var(--code-ink); background: var(--code-bg); padding: 3px 6px; font-family: var(--mono); font-size: 11px; }
    .compare { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-bottom: 18px; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--line); box-shadow: var(--shadow-soft); }
    .compare-card { padding: 15px 18px; background: var(--panel); }
    .compare-value { margin-top: 3px; font-size: 18px; font-weight: 750; }
    .delta.good { color: var(--good); }
    .delta.bad { color: var(--bad); }
    .table-wrap { overflow: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; z-index: 1; color: var(--muted); background: var(--panel); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
    td.path { max-width: 560px; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }
    tr:last-child td { border-bottom: 0; }
    .split { display: grid; grid-template-columns: minmax(290px, 42%) minmax(0, 1fr); gap: 18px; }
    .list-button { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 11px 13px; text-align: left; }
    .list-button:hover, .list-button[aria-current="true"] { background: var(--panel-2); }
    .list-button[aria-current="true"] { box-shadow: inset 3px 0 var(--accent); }
    .test-name { display: block; font-weight: 680; overflow-wrap: anywhere; }
    .test-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .test-list { max-height: 650px; overflow: auto; }
    .kv { display: grid; grid-template-columns: minmax(120px, 170px) 1fr; gap: 7px 14px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; overflow-wrap: anywhere; }
    .mono { font-family: var(--mono); }
    .loading, .fatal { max-width: 680px; margin: 14vh auto; padding: 34px; border: 1px solid var(--line); border-radius: 28px; background: var(--panel); box-shadow: var(--shadow); text-align: center; }
    .spinner { width: 28px; height: 28px; margin: 0 auto 13px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 1000px) {
      .metrics { grid-template-columns: repeat(3, 1fr); }
      .review-grid, .split { grid-template-columns: 1fr; }
      .gap-sidebar { min-height: 0; }
      .gap-list, .test-list { max-height: 360px; }
    }
    @media (max-width: 680px) {
      .shell { padding: 0 14px 38px; }
      .topbar { align-items: flex-start; flex-wrap: wrap; padding: 14px 0; }
      .top-controls { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
      .top-controls select { flex: 1; max-width: none; min-width: 130px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .compare { grid-template-columns: 1fr; }
      .tabs { overflow-x: auto; }
      .project { display: none; }
      .kv { grid-template-columns: 1fr; gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; } }

    /* The report follows the same quiet product language as supercov.com. */
    :root {
      --bg: #f5f5f7;
      --panel: rgba(255, 255, 255, .78);
      --panel-solid: #ffffff;
      --panel-2: rgba(118, 118, 128, .09);
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --faint: #8e8e93;
      --line: rgba(29, 29, 31, .09);
      --line-strong: rgba(29, 29, 31, .22);
      --accent: #0071e3;
      --accent-hover: #0077ed;
      --accent-2: #edf5ff;
      --good: #248a3d;
      --good-fill: #34c759;
      --good-bg: rgba(52, 199, 89, .12);
      --warn: #9a4d00;
      --warn-fill: #ff9500;
      --warn-bg: rgba(255, 149, 0, .13);
      --bad: #d70015;
      --bad-fill: #ff3b30;
      --bad-bg: rgba(255, 59, 48, .12);
      --limit: #8944ab;
      --limit-fill: #af52de;
      --limit-bg: rgba(175, 82, 222, .12);
      --glass: rgba(255, 255, 255, .54);
      --glass-control: rgba(255, 255, 255, .66);
      --glass-control-active: rgba(255, 255, 255, .88);
      --glass-highlight: rgba(255, 255, 255, .82);
      --shadow: 0 24px 80px rgba(71, 68, 61, .13), 0 2px 10px rgba(71, 68, 61, .05);
      --shadow-soft: 0 12px 34px rgba(71, 68, 61, .08);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg: #0b0b0c;
        --panel: rgba(37, 37, 40, .72);
        --panel-solid: #1c1c1e;
        --panel-2: rgba(255, 255, 255, .08);
        --ink: #f5f5f7;
        --muted: #a1a1a6;
        --faint: #8e8e93;
        --line: rgba(255, 255, 255, .12);
        --line-strong: rgba(255, 255, 255, .22);
        --accent: #2997ff;
        --accent-hover: #49a7ff;
        --accent-2: rgba(41, 151, 255, .14);
        --good: #30d158;
        --good-fill: #30d158;
        --good-bg: rgba(48, 209, 88, .14);
        --warn: #ff9f0a;
        --warn-fill: #ff9f0a;
        --warn-bg: rgba(255, 159, 10, .15);
        --bad: #ff453a;
        --bad-fill: #ff453a;
        --bad-bg: rgba(255, 69, 58, .15);
        --limit: #bf5af2;
        --limit-fill: #bf5af2;
        --limit-bg: rgba(191, 90, 242, .15);
        --glass: rgba(31, 31, 34, .56);
        --glass-control: rgba(255, 255, 255, .075);
        --glass-control-active: rgba(255, 255, 255, .13);
        --glass-highlight: rgba(255, 255, 255, .16);
        --shadow: 0 28px 90px rgba(0, 0, 0, .38), 0 2px 12px rgba(0, 0, 0, .24);
        --shadow-soft: 0 14px 38px rgba(0, 0, 0, .24);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0b0c;

    :root[data-theme="light"] { color-scheme: light; }

    body { position: relative; letter-spacing: -.006em; background:
      radial-gradient(circle at 2% 4%, color-mix(in srgb, #f5a45d, transparent 87%) 0, transparent 28rem),
      radial-gradient(circle at 98% 88%, color-mix(in srgb, #54a8ff, transparent 91%) 0, transparent 32rem),
      var(--bg); }
    body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .5; background: linear-gradient(135deg, rgba(255,255,255,.35), transparent 42%); }
    .report-layout { min-height: 100vh; display: grid; grid-template-columns: 246px minmax(0, 1fr); gap: 0; padding: 0; }
    .run-sidebar { position: sticky; top: 0; height: 100vh; min-width: 0; display: flex; flex-direction: column; padding: 22px 13px 14px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: color-mix(in srgb, var(--bg), var(--panel-solid) 24%); box-shadow: none; backdrop-filter: none; -webkit-backdrop-filter: none; }

          const head = node("div", "file-list-head"); const title = node("div"); title.append(node("div", "panel-title", fileName(selected.key)));
          const directory = fileDirectory(selected.key); if (directory) title.append(node("div", "small muted", directory));
          const coveredFiles = filesCoveredByTests(selected.tests); const kindNames = [...new Set(selected.tests.map(test => test.kind).filter(Boolean))].map(kindLabel); const health = testHealthParts(selected.tests).join(" · "); title.append(node("div", "small muted", [health, kindNames.join(" + "), `${integer(coveredFiles)} covered source ${coveredFiles === 1 ? "file" : "files"}`].filter(Boolean).join(" · "))); head.append(title);
          const search = node("input", "test-search"); search.type = "search"; search.placeholder = "Find a test in this file…"; search.value = state.testQuery; search.addEventListener("input", () => { const cursor = search.selectionStart; state.testQuery = search.value; render(); const next = document.querySelector(".test-search"); if (next) { next.focus(); next.setSelectionRange(cursor, cursor); } }); head.append(search); panel.append(head);
          const list = node("div", "file-list test-list");
          groupedTestsInFile(values).forEach(group => {
            const section = node("section", "test-group"); const groupHead = node("div", "test-group-head"); groupHead.append(node("span", "test-group-name", group.label), node("span", "test-group-count", `${integer(group.tests.length)} ${group.tests.length === 1 ? "test" : "tests"}`)); section.append(groupHead);
            group.tests.forEach(test => {
              const tone = testTone(test); const files = filesCoveredByTest(test); const row = button("", "test-row", () => { state.testId = test.id; state.testFileLimit = 12; render(); });
              const dot = node("span", `test-state-dot ${tone}`); const dotLabel = `${outcomeLabel(test.outcome)} test`; dot.title = dotLabel; dot.setAttribute("aria-label", dotLabel); row.append(dot);
              const identity = node("span", "test-row-identity"); identity.append(node("span", "test-row-name", testTitle(test))); const context = testGroupContext(test); if (context) identity.append(node("span", "test-row-context", context)); row.append(identity, node("span", "test-row-metric", files.length ? `${integer(files.length)} ${files.length === 1 ? "file" : "files"}` : ""));
              const chevron = node("span", "file-chevron", "›"); chevron.setAttribute("aria-hidden", "true"); row.append(chevron); section.append(row);
            });
            list.append(section);
          });
          if (!values.length) list.append(node("div", "empty", "No tests match this search.")); panel.append(list); content.append(panel); return;
        }
        state.testSuite = null;
      }

      const visibleFiles = testFiles.map(testFile => ({ ...testFile, matches: testFile.tests.filter(matchesQuery) })).filter(testFile => testFile.matches.length);
      const visibleTests = visibleFiles.flatMap(testFile => testFile.matches);
      const listPanel = node("section", "panel file-list-panel collection-view");
      if (state.testFileFilter) listPanel.append(button("‹ All tests", "back-button", () => { state.testFileFilter = null; state.testKind = "all"; state.testQuery = ""; render(); }));
      const head = node("div", "file-list-head"); const title = node("div");
      let summary = query ? `${integer(visibleTests.length)} ${visibleTests.length === 1 ? "match" : "matches"} across ${integer(visibleFiles.length)} test ${visibleFiles.length === 1 ? "file" : "files"}` : testHealthSummary(byKind, testFiles.length);
      if (state.testFileFilter) summary += ` · covering ${fileName(state.testFileFilter)}`;
      title.append(node("div", "panel-title", "Tests"), node("div", "small muted", summary)); head.append(title);
      if (kinds.length > 1) {
        const filters = node("div", "test-filters"); [["all", "All"], ...kinds.map(kind => [kind, kindLabel(kind)])].forEach(([kind, label]) => { const item = button(label, "test-filter", () => { state.testKind = kind; state.testSuite = null; state.testId = null; state.testFileLimit = 12; render(); }); item.setAttribute("aria-pressed", String(state.testKind === kind)); filters.append(item); }); head.append(filters);
      }
      const search = node("input", "test-search"); search.type = "search"; search.placeholder = "Find a test file or test…"; search.value = state.testQuery; search.addEventListener("input", () => { const cursor = search.selectionStart; state.testQuery = search.value; render(); const next = document.querySelector(".test-search"); if (next) { next.focus(); next.setSelectionRange(cursor, cursor); } }); head.append(search); listPanel.append(head);
      const list = node("div", "file-list test-list");
      visibleFiles.forEach(testFile => {
        const row = button("", "file-row", () => { state.testSuite = testFile.key; state.testId = null; state.testFileLimit = 12; render(); });
        const dot = node("span", `test-state-dot ${testFile.tone}`); const dotLabel = `${testHealthParts(testFile.tests).join(", ")} in this test file`; dot.title = dotLabel; dot.setAttribute("aria-label", dotLabel); row.append(dot);
        const identity = node("span", "file-row-identity"); identity.append(node("span", "file-row-name", fileName(testFile.key))); const directory = fileDirectory(testFile.key); if (directory) identity.append(node("span", "file-row-directory", directory)); row.append(identity);
        const count = query ? testFile.matches.length : testFile.tests.length; row.append(node("span", "file-row-metric", `${integer(count)} ${query ? (count === 1 ? "match" : "matches") : (count === 1 ? "test" : "tests")}`));
        const chevron = node("span", "file-chevron", "›"); chevron.setAttribute("aria-hidden", "true"); row.append(chevron); list.append(row);
      });
      if (!visibleFiles.length) list.append(node("div", "empty", "No test files match this search.")); listPanel.append(list); content.append(listPanel);
    }

    // Copy without a clipboard API.
    //
    // A report is opened from a file:// URL, which is not a secure context, so
    // navigator.clipboard is usually absent exactly where this button matters.
    // The textarea path is the one that runs most of the time, not the fallback.
    function copyBySelection(value) {
      return new Promise((resolve, reject) => {
        const field = document.createElement("textarea");
        field.value = value; field.setAttribute("readonly", "");
        field.style.position = "fixed"; field.style.opacity = "0";
        document.body.append(field); field.select();
        let copied = false;
        try { copied = document.execCommand("copy"); } catch { copied = false; }
        field.remove();
        copied ? resolve() : reject(new Error("Copy failed"));
      });
    }
    function copyText(value) {
      // The clipboard API also rejects in a secure context when the document
      // does not hold focus or permission was refused, and the selection path
      // often still works there, so it is tried on any failure rather than only
      // when the API is missing.
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(value).catch(() => copyBySelection(value));
      }
      return copyBySelection(value);
    }

    // What to run to obtain the judgment this item is missing, as a prompt the
    // reader can paste. No price is quoted: a report outlives the rates.
    function promptFor(kind) {
      if (kind === "quality") {
        return {
          title: "Assess this code's quality",
          body: "Supercov has coverage for this run but no quality assessment of the same source. Quality is judged by a model, so it needs an API credential and it costs money to produce.",
          command: "export TYPESAFE_API_KEY=<your key>\nnpx supercov quality\nnpx supercov report",
          note: "Run this in the project the report was made from. Assessing the same source as this run pairs the two on one timeline entry."
        };
      }
      if (kind === "run") {
        return {
          title: "Measure this code with tests",
          body: "This assessment has no coverage run against the same source. Measuring is free and runs locally; it needs the project's own test command.",
          command: "npx supercov -- <your test command>\nnpx supercov report",
          note: "Use the complete test command the repository already trusts, so the measurement covers the whole suite."
        };
      }
      return {
        title: "Explain what the tests assert",
        body: "This run recorded assertions but nothing explains what they prove. Assertion coverage needs an authored map, which Supercov never writes for you.",
        command: "npx supercov runs latest assertions\nnpx supercov docs assertion-agent",
        note: "The map lives in the run's own directory. The agent guide describes how to author and validate it."
      };
    }

    function renderPrompt() {
      if (!state.prompt) return null;
      const detail = promptFor(state.prompt);
      const layer = node("div", "prompt-layer");
      const close = () => { state.prompt = null; render(); };
      layer.addEventListener("click", event => { if (event.target === layer) close(); });
      const dialog = node("div", "prompt-modal");
      dialog.setAttribute("role", "dialog"); dialog.setAttribute("aria-modal", "true"); dialog.setAttribute("aria-label", detail.title);
      dialog.append(node("h2", "prompt-title", detail.title), node("p", "prompt-copy", detail.body));
      const command = node("pre", "prompt-command", detail.command); dialog.append(command);
      dialog.append(node("p", "small muted", detail.note));
      const status = node("p", "prompt-status", "");
      const actions = node("div", "prompt-actions");
      const copy = button("Copy prompt", "prompt-copy-button", () => {
        copyText(detail.command).then(
          () => { copy.textContent = "Copied"; status.textContent = "Copied to clipboard."; },
          () => { status.textContent = "Copy failed. Select the command above and copy it manually."; }
        );
      });
      actions.append(copy, button("Close", "prompt-close", close));
      dialog.append(actions, status);
      layer.append(dialog);
      document.addEventListener("keydown", function escape(event) {
        if (event.key === "Escape") { document.removeEventListener("keydown", escape); close(); }
      });
      return layer;
    }

    // A judgment this item does not carry, said plainly, with the way to get it.
    function renderMissing(kind, heading, copy) {
      const card = node("div", "missing-card");
      card.append(node("div", "missing-heading", heading), node("div", "missing-copy", copy));
      if (kind) card.append(button("How to add this", "missing-action", () => { state.prompt = kind; render(); }));
      return card;
    }

    function render() {
      const run = currentRun();
      const quality = currentQuality();
      setHash(); app.replaceChildren();
      const layout = node("div", "report-layout"); renderSidebar(layout);
      const shell = node("main", "report-main"); renderTabs(shell);
      if (!run) {
        if (state.tab === "review") renderQualityOnly(shell, quality);
        else {
          const content = node("div", "report-content standalone"); content.setAttribute("role", "tabpanel");
          if (state.tab === "explore" && quality) renderQualityFiles(content, quality);
          else content.append(node("div", "empty", "This entry has no coverage run, so there are no tests to show."));
          shell.append(content);
        }
      } else if (state.tab === "review") renderHero(shell, run);
      else { const content = node("div", "report-content standalone"); content.setAttribute("role", "tabpanel"); if (state.tab === "explore") renderExplore(content, run); else renderTests(content, run); shell.append(content); }
      layout.append(shell); app.append(layout);
      const prompt = renderPrompt(); if (prompt) app.append(prompt);
      syncThemeUi();
    }

    async function load() {
      try {
        let theme = null; try { theme = localStorage.getItem("supercov-report-theme"); } catch {}
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        if (typeof DecompressionStream !== "function") throw new Error("This browser cannot decompress portable reports. Use a current Chrome, Edge, Firefox, or Safari release.");
        const binary = atob(payload); const bytes = new Uint8Array(binary.length); for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        const bundle = await new Response(stream).json();
        // A report may carry assessments and no runs, so the timeline is what
        // must not be empty.
        if (bundle.schemaVersion !== 2 || !Array.isArray(bundle.timeline) || !bundle.timeline.length) throw new Error("The embedded report data is incompatible or empty.");
        state.bundle = bundle;
        state.itemId = bundle.selectedId;
        state.runId = bundle.selectedRunId || null;
        state.compareId = bundle.comparisonRunId || null;
        readHash();
        const item = currentItem();
        state.itemId = item.id;
        state.runId = item.runId || null;
        if (state.runId && (state.runId !== bundle.selectedRunId || state.compareId === state.runId)) state.compareId = previousRunId(state.runId);
        if (!state.runId) state.compareId = null;
        render();
      } catch (error) {
        app.replaceChildren(); const fatal = node("div", "fatal"); fatal.append(node("h1", "", "Could not open this report"), node("p", "muted", error instanceof Error ? error.message : String(error)), node("p", "small muted", "The file stays private and no network request was attempted.")); app.append(fatal);
      }
    }
    systemTheme.addEventListener("change", syncThemeUi);
    load();
  })();
  </script>
</body>
</html>
