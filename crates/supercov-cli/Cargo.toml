[package]
name = "supercov"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-configuration, runner-aware structural and MC/DC coverage"
keywords = ["coverage", "testing", "mcdc", "cli"]
categories = ["command-line-utilities", "development-tools::testing"]
publish = ["crates-io"]

# `cargo install supercov` builds the engine from source, which takes minutes.
# Every release attaches the same prebuilt binaries the npm packages carry to
# its GitHub release, so `cargo binstall supercov` downloads one instead. The
# assets are named for the npm platform rather than the Rust target, so each
# target points at its own; inside, every tarball is an npm package, with the
# binary at package/bin/.
[package.metadata.binstall]
pkg-fmt = "tgz"
bin-dir = "package/bin/{ bin }{ binary-ext }"


[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-darwin-arm64-{ version }.tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-darwin-x64-{ version }.tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-linux-arm64-gnu-{ version }.tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-linux-x64-gnu-{ version }.tgz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-linux-arm64-musl-{ version }.tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-linux-x64-musl-{ version }.tgz"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-win32-arm64-{ version }.tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/supercov-cli-win32-x64-{ version }.tgz"

[[bin]]
name = "supercov"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
supercov-contracts.workspace = true
supercov-engine.workspace = true
time.workspace = true
