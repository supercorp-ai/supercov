[workspace]
members = [
  "crates/supercov-cli",
  "crates/supercov-contracts",
  "crates/supercov-engine",
]
resolver = "3"

[workspace.package]
version = "0.0.9"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/supercorp-ai/supercov"

[workspace.dependencies]
base64 = "0.22"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
memmap2 = "0.9.11"
reflink-copy = "0.1.30"
oxc_allocator = "0.133.0"
oxc_ast = "0.133.0"
oxc_ast_visit = "0.133.0"
oxc_codegen = { version = "0.133.0", default-features = false, features = ["sourcemap"] }
oxc_parser = "0.133.0"
oxc_semantic = "0.133.0"
oxc_sourcemap = "6.1.1"
oxc_span = "0.133.0"
oxc_syntax = "0.133.0"
oxc_traverse = "0.133.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
supercov-contracts = { path = "crates/supercov-contracts" }
supercov-engine = { path = "crates/supercov-engine" }
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
