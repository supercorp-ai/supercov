name: Slow tier

# What a pull request must pass before it merges beyond the fast tier (CI):
# Self Coverage with its 100% gate on the lines the change adds or changes,
# Compatibility, React, Next.js and the release gates. It runs once, on the
# commit that merges (scripts/ci-tiers.mjs decide):
#
#   - on the merge queue's commit (`merge_group`): the pull request on main as
#     main is now, on what the group changes, or in full for a release pull
#     request or `full-ci`. The queue merges once this run's `Slow tier`
#     status on that commit passes;
#   - on a pull request, only every push to a release pull request and
#     `full-ci` when it is added, in full. Any other pull request's commit is
#     given `Slow tier` success, "runs in the merge queue", and runs nothing:
#     run there as well, it took the runners twice, and the slow tiers of
#     every ready pull request starved the queue's own runs;
#   - each night on main, in full;
#   - by hand, in full: `gh workflow run slow-tier.yml --ref <branch>`.
#
# Its answer is the `Slow tier` commit status, which branch protection
# requires and a release reads (publish.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push or a newer `full-ci` replaces the run before it, and a push
# makes a run on the commit before it moot. A label that asks for nothing is
# a run of its own and cancels nothing.
concurrency:
  group: slow-tier-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || 'tier' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      full: ${{ steps.decide.outputs.full }}
      self-coverage: ${{ steps.decide.outputs.self-coverage }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - id: decide
        run: node scripts/ci-tiers.mjs decide
        env:
          GH_TOKEN: ${{ github.token }}

  self-coverage:
    needs: decide
    if: needs.decide.outputs.self-coverage == 'true'
    uses: ./.github/workflows/self-coverage.yml
    permissions:
      contents: read
      actions: read

  compatibility:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read
      actions: write
      issues: write

  react:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/react-compatibility.yml
    permissions:
      contents: read
      actions: write

  next:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/next-compatibility.yml
    permissions:
      contents: read
      actions: write

  release-gates:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/release-gates.yml
    permissions:
      contents: read
      actions: write

  # The `Slow tier` status of the commit: every workflow above passed (a
  # skipped one was not needed: Self Coverage measured main's commit on its
  # push already), or which failed.
  verdict:
    name: Slow tier
    needs: [decide, self-coverage, compatibility, react, next, release-gates]
    if: ${{ !cancelled() && needs.decide.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Whether this run was cancelled, and which run set the status last.
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - run: node scripts/ci-tiers.mjs report "Slow tier"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ needs.decide.outputs.full }}
          SHA: ${{ needs.decide.outputs.sha }}
