name: Slow tier

# What a pull request must pass before it merges beyond the fast tier (CI):
# Self Coverage with its 100% gate on the lines the change adds or changes,
# Compatibility, React, Next.js and the release gates. Each ran on every push
# to every pull request ready for review; with three to six pushes a pull
# request, that was most of an hour before each push said whether it was green,
# and most of the organisation's runners. It runs once a pull request is ready
# to merge instead (scripts/ci-tiers.mjs decide):
#
#   - the `ready` label added to a pull request that is not a draft
#     (`gh pr edit <n> --add-label ready`), or `full-ci`, which also runs
#     every platform;
#   - a draft marked ready for review;
#   - every push to a release pull request, in full;
#   - each night on main, in full;
#   - by hand, in full: `gh workflow run slow-tier.yml --ref <branch>`.
#
# A push after it ran takes the `ready` label off: the new commit has not
# passed, and adding the label again runs it on that commit. Its answer is the
# `Slow tier` commit status, which branch protection requires and a release
# reads (publish.yml).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push or a newer `ready` replaces the run before it, and a push
# makes a run on the commit before it moot. A label that asks for nothing is
# a run of its own and cancels nothing.
concurrency:
  group: slow-tier-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ready' && github.event.label.name != 'full-ci' && github.run_id || 'tier' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
      # A `ready` label a newer push outlived is taken off.
      pull-requests: write
    outputs:
      run: ${{ steps.decide.outputs.run }}
      full: ${{ steps.decide.outputs.full }}
      self-coverage: ${{ steps.decide.outputs.self-coverage }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - id: decide
        run: node scripts/ci-tiers.mjs decide
        env:
          GH_TOKEN: ${{ github.token }}

  self-coverage:
    needs: decide
    if: needs.decide.outputs.self-coverage == 'true'
    uses: ./.github/workflows/self-coverage.yml
    permissions:
      contents: read
      actions: read

  compatibility:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read
      actions: write
      issues: write

  react:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/react-compatibility.yml
    permissions:
      contents: read
      actions: write

  next:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/next-compatibility.yml
    permissions:
      contents: read
      actions: write

  release-gates:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    uses: ./.github/workflows/release-gates.yml
    permissions:
      contents: read
      actions: write

  # The `Slow tier` status of the commit: every workflow above passed (a
  # skipped one was not needed: Self Coverage measured main's commit on its
  # push already), or which failed.
  verdict:
    name: Slow tier
    needs: [decide, self-coverage, compatibility, react, next, release-gates]
    if: ${{ !cancelled() && needs.decide.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Whether this run was cancelled, and which run set the status last.
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - run: node scripts/ci-tiers.mjs report "Slow tier"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ needs.decide.outputs.full }}
          SHA: ${{ needs.decide.outputs.sha }}
