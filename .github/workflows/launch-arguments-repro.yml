# Temporary: reproduce how each launcher hands Supercov its arguments.
name: Launch arguments repro
on:
  push:
    branches: [fix/launch-arguments]
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: oven-sh/setup-bun@v2
      - uses: denoland/setup-deno@v2
      - uses: astral-sh/setup-uv@v6
      - run: corepack enable
      - run: cargo build -p supercov
      - run: cargo test -p supercov-engine --lib process_supervision::tests
      - run: cargo test -p supercov --test cli separator_was_lost
      - run: node scripts/launch-arguments-integration.mjs --binary target/debug/supercov${{ runner.os == 'Windows' && '.exe' || '' }} --report launch-arguments-${{ matrix.os }}.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: launch-arguments-${{ matrix.os }}
          path: launch-arguments-${{ matrix.os }}.json
