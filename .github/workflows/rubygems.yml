name: Publish RubyGem

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish arm64-darwin gem
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build the self-contained Rust binary and platform gem
        run: npm run build:rubygem
      - name: Install the packed gem and complete a real coverage run
        run: npm run test:rubygem
      - name: Configure short-lived RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish the verified platform gem
        run: gem push target/rubygems/supercov-*.gem
