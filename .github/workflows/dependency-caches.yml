name: Dependency caches

# Temporary experiment: what each OS's JVM cache holds, and what each step
# fetches from an empty cache on Linux.
on:
  workflow_dispatch:
    inputs:
      os:
        default: ""
        type: string

permissions:
  contents: read

jobs:
  list:
    name: List (${{ matrix.os }})
    if: inputs.os != 'fresh'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/jvm-dependencies
        with:
          step: restore
      - shell: bash
        run: |
          cd ~
          { find .m2/repository -type f; find .gradle/caches/modules-2 -type f; find .gradle/wrapper/dists -maxdepth 2 -mindepth 2 -type d; } 2>/dev/null | sort > "$RUNNER_TEMP/list-${{ matrix.os }}.txt" || true
          wc -l "$RUNNER_TEMP/list-${{ matrix.os }}.txt"
          du -sh .m2/repository .gradle/caches/modules-2 .gradle/wrapper/dists 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: list-${{ matrix.os }}
          path: ${{ runner.temp }}/list-${{ matrix.os }}.txt

  fresh:
    name: Fresh (ubuntu-latest)
    if: inputs.os != 'list'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/jvm-dependencies
        with:
          step: restore
      - name: Empty the restored caches, keeping the mirror settings
        shell: bash
        run: rm -rf ~/.m2/repository ~/.gradle/caches/modules-2 ~/.gradle/wrapper/dists
      - name: Install the Kotlin compiler
        shell: bash
        run: |
          version=2.2.20
          bash .github/fetch-verified.sh \
            "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-compiler-$version.zip" \
            "$RUNNER_TEMP/kotlin.zip" sha256
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch the JUnit Platform console runner
        shell: bash
        run: |
          path=org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          jar="$HOME/.m2/repository/$path"
          bash .github/fetch-verified.sh "https://repo1.maven.org/maven2/$path" "$jar" sha1
          echo "JUNIT_CONSOLE_JAR=$jar" >> "$GITHUB_ENV"
      - uses: ./.github/actions/apache-ant
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compatibility
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - run: npm ci
      - run: cargo nextest run --workspace --no-run && cargo test --no-run -p supercov-engine --test jvm_frontend --test jvm_run && cargo build -p supercov
      - name: list 0
        run: cd ~ && { find .m2/repository -type f; find .gradle/caches/modules-2 -type f; find .gradle/wrapper/dists -maxdepth 2 -mindepth 2 -type d; true; } 2>/dev/null | sort > "$RUNNER_TEMP/fresh-0-start.txt"; wc -l "$RUNNER_TEMP/fresh-0-start.txt"
      - run: npm run test:jvm
        continue-on-error: true
        env:
          SUPERCOV_REQUIRE_JVM: "1"
      - name: list 1
        run: cd ~ && { find .m2/repository -type f; find .gradle/caches/modules-2 -type f; find .gradle/wrapper/dists -maxdepth 2 -mindepth 2 -type d; true; } 2>/dev/null | sort > "$RUNNER_TEMP/fresh-1-testjvm.txt"; wc -l "$RUNNER_TEMP/fresh-1-testjvm.txt"
      - run: node scripts/java-syntax-zoo.mjs || true; node scripts/mutation-report-formats.mjs || true; node scripts/assertions-integration.mjs || true
      - name: list 2
        run: cd ~ && { find .m2/repository -type f; find .gradle/caches/modules-2 -type f; find .gradle/wrapper/dists -maxdepth 2 -mindepth 2 -type d; true; } 2>/dev/null | sort > "$RUNNER_TEMP/fresh-2-scripts.txt"; wc -l "$RUNNER_TEMP/fresh-2-scripts.txt"
      - run: cargo nextest run -p supercov --no-fail-fast
        continue-on-error: true
      - name: list 3
        run: cd ~ && { find .m2/repository -type f; find .gradle/caches/modules-2 -type f; find .gradle/wrapper/dists -maxdepth 2 -mindepth 2 -type d; true; } 2>/dev/null | sort > "$RUNNER_TEMP/fresh-3-cli.txt"; wc -l "$RUNNER_TEMP/fresh-3-cli.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: fresh
          path: ${{ runner.temp }}/fresh-*.txt
