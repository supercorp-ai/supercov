name: Dependency caches

# The caches pull requests restore, kept in main's Actions cache: the Rust
# builds' dependencies (CI's toolchain, and Compatibility's), npm's
# packages, the system packages Chromium needs, what the tests' Maven and
# Gradle builds fetch, and Apache Ant with the jars its tests use.
#
# A pull request's runs can read main's caches and their own, never another
# pull request's. With nothing on main, every pull request saved a copy of
# each for itself -- some forty caches, a Rust build's dependencies at
# 400 MB each -- and the repository has 10 GB for all of them: main's were
# the first evicted, so the next pull request found nothing either. Pull
# requests now save only what main does not keep (the JVM caches grow by
# what a run fetched beyond them), and this keeps main's.
#
# The tests are run here for what they fetch, not for their verdicts: a test
# failing does not fail this workflow, and CI and Compatibility judge them.
#
# Each job is kept to about ten minutes. A platform's JVM tests ran in one job
# with the build of every workspace test and the CLI's whole suite: 40 to 50
# minutes on Windows, where the CLI's tests alone took 20. Now the Rust cache,
# the build and the JVM tests are jobs of their own: the Rust cache is built
# only when its key is new (an exact hit is never saved again), the build hands
# the JVM tests to the next job as a nextest archive, and the CLI's tests are
# no longer run here: from an empty cache on 2026-11-27 (run 46036067075), the
# JVM tests fetched all 1,614 files, and the scripts and the CLI's 802 tests
# after them fetched none. Should a new CLI test fetch something, its pull
# request's runs still save what they fetched for themselves.

on:
  push:
    branches: [main]
    # What the caches' keys are made of: the lockfiles and manifests, the
    # toolchains the workflows name, and these actions.
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - package-lock.json
      - .github/actions/jvm-dependencies/**
      - .github/actions/apache-ant/**
      - .github/actions/system-packages/**
      - .github/fetch-verified.sh
      - .github/workflows/dependency-caches.yml
      - .github/workflows/ci.yml
      - .github/workflows/compatibility.yml
  # Weekly as well: a cache nothing reads for seven days is evicted, and new
  # tests fetch new things.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      os:
        description: "JSON list of runners for the JVM job. Empty runs every platform it seeds."
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: dependency-caches-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI's one Rust cache (shared key `ci`, toolchain 1.95.0): what each of its
  # Linux jobs builds -- the workspace's tests, clippy, the CLI, the release
  # build the release gates link with cargo-zigbuild -- in one target
  # directory, so that every job restores what it needs from one cache.
  rust:
    name: CI's Rust cache and system packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          # npm's cache for main only: a run on another branch would keep a
          # copy no pull request can read.
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy, rustfmt, llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - run: npm ci
      # engine-integrations' and rust-wasm-js's Chromium libraries.
      - uses: ./.github/actions/system-packages
        with:
          command: npx playwright install-deps chromium
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          prefix: apt-chromium-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo nextest run --workspace --no-run
      - run: cargo clippy --workspace --all-targets
      - run: cargo build -p supercov
      - run: python3 -m pip install --user --break-system-packages cargo-zigbuild ziglang
      - run: cargo zigbuild --release --target x86_64-unknown-linux-gnu.2.28 -p supercov
        env:
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

  # Compatibility's Rust cache (shared key `compatibility`), one per platform.
  # rust-cache never saves over an exact hit, so the workspace is built only
  # when the key is new: a new lockfile, manifest or toolchain, or the cache
  # evicted.
  compatibility-rust:
    name: Compatibility's Rust cache (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every platform a pull request's JVM tests run on.
        os: ${{ inputs.os && fromJSON(inputs.os) || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: compatibility
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # What Compatibility's jobs build: the workspace's tests, the JVM tests,
      # the CLI.
      - if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo nextest run --workspace --no-run && cargo test --no-run -p supercov-engine --test jvm_frontend --test jvm_run && cargo build -p supercov

  # The JVM tests and the CLI, built once per platform for the job that runs
  # them, from Compatibility's Rust cache (only read here). Also npm's cache
  # for the platform, which Compatibility's jobs restore.
  jvm-build:
    name: JVM tests' build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os && fromJSON(inputs.os) || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@v6
      - id: node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          # npm's cache for main only: a run on another branch would keep a
          # copy no pull request can read.
          cache: ${{ github.ref == 'refs/heads/main' && 'npm' || '' }}
      # What fills npm's cache, when there is one to save.
      - if: github.ref == 'refs/heads/main' && steps.node.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: compatibility
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Build the JVM tests and the CLI
        shell: bash
        run: |
          cargo nextest archive -p supercov-engine --test jvm_frontend --test jvm_run --archive-file "$RUNNER_TEMP/jvm-tests.tar.zst"
          cargo build -p supercov
          mkdir -p "$RUNNER_TEMP/built"
          mv "$RUNNER_TEMP/jvm-tests.tar.zst" "$RUNNER_TEMP/built/"
          cp target/debug/supercov* "$RUNNER_TEMP/built/" 2> /dev/null || true
          rm -f "$RUNNER_TEMP"/built/*.d
          ls -la "$RUNNER_TEMP/built"
      - uses: actions/upload-artifact@v4
        with:
          name: jvm-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/built
          retention-days: 1
          compression-level: 0

  jvm:
    name: JVM dependencies (${{ matrix.os }})
    needs: jvm-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os && fromJSON(inputs.os) || fromJSON('["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest", "windows-11-arm"]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/jvm-dependencies
        with:
          step: restore
      # As Compatibility's JDK jobs have them: the Kotlin compiler, the JUnit
      # Platform console runner, and Apache Ant with its jars.
      - name: Install the Kotlin compiler
        shell: bash
        run: |
          version=2.2.20
          bash .github/fetch-verified.sh \
            "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-compiler-$version.zip" \
            "$RUNNER_TEMP/kotlin.zip" sha256
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Fetch the JUnit Platform console runner
        shell: bash
        run: |
          path=org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar
          jar="$HOME/.m2/repository/$path"
          bash .github/fetch-verified.sh "https://repo1.maven.org/maven2/$path" "$jar" sha1
          [ "$RUNNER_OS" = Windows ] && jar=$(cygpath -w "$jar")
          echo "JUNIT_CONSOLE_JAR=$jar" >> "$GITHUB_ENV"
      - uses: ./.github/actions/apache-ant
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: actions/download-artifact@v5
        with:
          name: jvm-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/built
      - name: Put the CLI where the scripts look for it
        shell: bash
        run: |
          mkdir -p target/debug
          cp "$RUNNER_TEMP"/built/supercov* target/debug/
          chmod +x target/debug/supercov* || true
      # What Compatibility's JDK jobs run (`npm run test:jvm`): the JVM tests,
      # ignored ones included, one at a time, then the side-by-side run.
      - name: Run the JVM tests
        shell: bash
        continue-on-error: true
        timeout-minutes: 20
        env:
          SUPERCOV_REQUIRE_JVM: "1"
        run: cargo-nextest nextest run --archive-file "$RUNNER_TEMP/built/jvm-tests.tar.zst" --workspace-remap . --run-ignored all --test-threads 1 --no-fail-fast
      - run: node scripts/side-by-side.mjs jvm
        continue-on-error: true
        timeout-minutes: 5
      # The scripts engine-integrations runs that build with Maven.
      - if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          npm ci
          node scripts/java-syntax-zoo.mjs || true
          node scripts/mutation-report-formats.mjs || true
          node scripts/assertions-integration.mjs || true
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/jvm-dependencies
        with:
          step: save
