name: Debug worker shutdown
on:
  pull_request:
    paths:
      - .github/workflows/debug-worker.yml
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: sudo apt-get install -y strace
      - run: npm ci
      - run: cargo build -p supercov
      - name: The gate, every kill traced
        run: |
          ps -o pid,pgid,sid,comm -p $$ -p $PPID
          strace -f -tt -qq -e trace=kill,tgkill,tkill,setpgid,setsid -e signal=none node scripts/rust-worker-cargo-test.mjs
        env:
          SUPERCOV_REQUIRE_RUST_WORKER: "1"
