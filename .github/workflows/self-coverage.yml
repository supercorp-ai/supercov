name: Self Coverage

# Supercov measuring itself: the workspace's tests, end-to-end gates included,
# run under a release build of the same commit. The gates take turns through a
# file lock, so in one process they take hours; here they are split across
# jobs, each measured on its own, and the runs merged into one per platform.
# Linux and macOS compile different code, so each platform is merged on its own.
#
# Every push to main is measured in full, held to 100% lines, branches and
# MC/DC, and kept as the map CI's plan reads (`affected-map`): which code each
# test ran, for `tests affected` to say which tests a pull request's change
# can reach, and with each test's seconds (`test-seconds`), which CI and these
# slices deal their tests by. A pull request is measured by the slow tier
# (slow-tier.yml), once it is ready to merge: its affected tests and every
# test written in a file it changed (a test it adds is in no map;
# scripts/ci-affected.mjs), and the lines it adds or changes held to 100% --
# every other line is covered as on main, by tests the change cannot reach. A
# release pull request, a change to CI, or a change the map cannot answer for
# is measured in full and held to 100% everywhere: the speed releases that
# skipped this measurement left 161 gaps on main that nothing reported. The
# `self-coverage-macos` label, or `macos: true` by hand, measures macOS too;
# the two platforms differ by a handful of gaps.

on:
  # The slow tier's measurement of a pull request, and its nightly one.
  workflow_call:
    inputs:
      macos:
        type: boolean
        default: false
      tests:
        type: string
        default: ""
      files:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      macos:
        description: "Measure macOS as well as Linux"
        type: boolean
        default: false
      tests:
        description: "Space-separated test-name filters: measure only the tests whose names contain one, in one slice, to see whether new tests cover the lines they were written for. Empty measures every test and holds the 100% floor."
        type: string
        default: ""
      files:
        description: "Space-separated path prefixes: the step summary counts the gaps in these files. Most useful with tests."
        type: string
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  # The plan finds main's map among this workflow's runs.
  actions: read

# A newer measurement of a pull request replaces the one before (the slow
# tier runs one per commit it is asked for). On main a measurement is never
# cancelled -- a busy day would leave no map -- and only the newest push, or
# the nightly run, waits behind the one running.
concurrency:
  group: self-coverage-${{ github.ref }}-measure
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SLICES: 10

jobs:
  # Which tests a pull request's change can affect: they alone are measured.
  # Every test on a push, by hand, on a release pull request, on a change to
  # CI, or when the map cannot answer (the step summary says why).
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.affected.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: affected
        uses: ./.github/actions/affected
        with:
          workflow: self-coverage

  platforms:
    needs: plan
    if: fromJSON(needs.plan.outputs.jobs).measure.run
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - id: os
        run: |
          if [ "${{ inputs.macos }}" = true ] || [ "${{ contains(github.event.pull_request.labels.*.name, 'self-coverage-macos') }}" = true ]; then
            echo 'os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: platforms
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      # The measure build's dependencies kept between runs, saved by main's
      # run (this workflow runs on a push to main) and only restored by a
      # pull request's.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # The system packages the slices' browsers need, fetched once here and
      # kept before any slice starts: ten slices fetching them at once from
      # a slow mirror held some for half an hour, the cache being saved only
      # as a job ends.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/system-packages
        with:
          command: npx -y "playwright@$(git ls-files '*package-lock.json' | xargs jq -r '.packages["node_modules/playwright-core"].version // empty' | sort -uV | tail -1)" install-deps
          key: apt-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}
          prefix: apt-playwright-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo build --profile measure -p supercov
      - uses: actions/upload-artifact@v4
        with:
          name: supercov-self-${{ matrix.os }}
          path: target/measure/supercov
          retention-days: 3

  # Beside the build, not after it: a slice's setup takes as long as the
  # build, and the slice waits for the build only where it needs it, at its
  # tests (below).
  measure:
    needs: [plan, platforms]
    name: Measure ${{ matrix.os }} slice ${{ matrix.slice }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
        # Slice 0 is every test but the gates and half the CLI's; slice 9
        # is that half, which ran last and longest in slice 0; slices 1..8
        # share the gates by their time.
        # A targeted measurement (`tests`) is one slice of the named tests.
        # A pull request's affected tests take as few slices as hold them.
        slice: ${{ inputs.tests != '' && fromJSON('[0]') || fromJSON(needs.plan.outputs.jobs).measure.matrix.slice }}
    env:
      AFFECTED: ${{ fromJSON(needs.plan.outputs.jobs).measure.mode == 'partial' }}
      AFFECTED_SLICES: ${{ fromJSON(needs.plan.outputs.jobs).measure.slices }}
    steps:
      # The instrumented workspace, its build and the gates' toolchains do not
      # fit a Linux runner's free space as it comes.
      # In the background: the space is wanted by the build, minutes after
      # the setup steps this would otherwise hold up by a minute or more.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: tc39/test262
          ref: 3655e7464de3d52643ecddd4b5f9f4f3e7f62398
          path: test262
      # Outside the repository, as locally: the measured copy of the
      # workspace has no business holding fifty thousand test files.
      - run: mv test262 "$RUNNER_TEMP/test262"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # What the Maven and Gradle tests resolve, kept: fetched each run, they
      # took nine minutes of one slice. Restored only: CI's check and
      # engine-integrations jobs run the same tests and scripts, and keep
      # what they fetch; ten slices saving would crowd the cache. Maven's
      # and Gradle's own retries are turned up for the rest.
      - uses: ./.github/actions/jvm-dependencies
        with:
          step: restore
      # The Ant tests skip without it, and the Ant support then shows as
      # gaps the local measurement does not have. After the cache: a key
      # restored from before these jars still gets them.
      - uses: ./.github/actions/apache-ant
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The Bun tests skip without it, and the map would then say they run
      # none of what CI's bun-bootstrap job runs them for.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # A version, not the latest: asking GitHub's API for the latest
      # release timed out on 2026-11-24 and failed the job before its tests.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.9"
      # The versions CI's wasm and worker jobs use.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129,wasm-pack@0.15.0,cargo-nextest@0.9.140
      # install-action has no build of worker-build, and compiling it took two
      # minutes of every slice: compiled once per version and kept.
      - id: worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ runner.arch }}
      - if: steps.worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      - name: Install wasmtime 49.0.3
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64) build=x86_64-linux ;;
            macOS-ARM64) build=aarch64-macos ;;
            macOS-X64) build=x86_64-macos ;;
          esac
          curl -q -sSfL --retry 6 --retry-all-errors --retry-delay 10 "https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-$build.tar.xz" -o "$RUNNER_TEMP/wasmtime.tar.xz"
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v49.0.3-$build" >> "$GITHUB_PATH"
      - run: npm ci
      # The browsers of every pinned Playwright, kept while no lockfile
      # changes; the system libraries they need are installed each time.
      # The lockfiles hashed once, before the tests: a cache's post step
      # evaluates its key again, and `hashFiles('**/...')` then walks
      # whatever the tests left in the checkout and fails the slice.
      - name: Hash the lockfiles
        id: locks
        run: echo "hash=$(git ls-files -s '*package-lock.json' | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
      # Restored only, but for main's run: at 1.2 GB, a copy saved by each
      # pull request was an eighth of the repository's 10 GB, and three of
      # them evicted main's caches. Saved below, once the browsers are in.
      - id: browsers
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.locks.outputs.hash }}
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-
      # The system libraries the browsers need are 142 MB of packages a
      # slice fetched every run; one run's mirror gave them at 74 kB/s, 32
      # minutes. Kept, and apt installs from what is kept.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/system-packages
        with:
          command: npx -y "playwright@$(git ls-files '*package-lock.json' | xargs jq -r '.packages["node_modules/playwright-core"].version // empty' | sort -uV | tail -1)" install-deps
          key: apt-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.locks.outputs.hash }}
          prefix: apt-playwright-${{ runner.os }}-${{ runner.arch }}-
      # Each fixture pins its own Playwright, and each version launches its
      # own browser builds: install them for every version a lockfile names.
      - name: Install every pinned Playwright's browsers
        run: |
          versions=$(git ls-files '*package-lock.json' | xargs jq -r '.packages["node_modules/playwright-core"].version // empty' | sort -uV)
          for version in $versions; do
            # A version older than the runner's OS knows no browser build for
            # it -- the Next fixture keeps the reporter's 1.60 -- and fetches
            # its Ubuntu 24.04 Chromium, which runs there. Every other one
            # installs its own builds: 24.04's WebKit wants 24.04's libraries.
            if ! npx -y "playwright@$version" install; then
              PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 npx -y "playwright@$version" install chromium
            fi
          done
      - if: github.ref == 'refs/heads/main' && matrix.slice == 0 && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.locks.outputs.hash }}
      # The build job's Supercov, once it has kept it: this slice started
      # beside the build. A build that failed fails the slice.
      - name: Wait for the build
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: supercov-self-${{ matrix.os }}
          BUILD: Build on ${{ matrix.os }}
        run: |
          for attempt in $(seq 1 120); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT" --jq '.total_count' 2>/dev/null || echo 0)
            [ "$found" -gt 0 ] && exit 0
            # A job of a called workflow is named after its caller's job too.
            build=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/${GITHUB_RUN_ATTEMPT:-1}/jobs?per_page=100" \
              --jq ".jobs[] | select(.name == \"$BUILD\" or (.name | endswith(\"/ $BUILD\"))) | .conclusion // \"\"" 2>/dev/null | head -1)
            case "$build" in
              failure|cancelled|skipped) echo "$BUILD ended $build: there is no Supercov to measure with."; exit 1 ;;
            esac
            sleep 10
          done
          echo "$BUILD kept no Supercov in twenty minutes."
          exit 1
      - uses: actions/download-artifact@v5
        with:
          name: supercov-self-${{ matrix.os }}
          path: ${{ runner.temp }}/self
      # The plan's selection, and the test seconds every slice deals by: the
      # same file for every slice, or a test could be dealt to none.
      - uses: actions/download-artifact@v5
        with:
          name: affected-selection-self-coverage
          path: ${{ runner.temp }}/affected
      - name: Choose this slice's tests
        id: tests
        env:
          TARGET_TESTS: ${{ inputs.tests }}
          CI_TEST_SECONDS: ${{ runner.temp }}/affected/test-seconds.tsv
        run: |
          # What this platform cannot run: the clang oracle's golden file
          # comes from Apple's clang; macOS runners have no Docker.
          if [ "${{ runner.os }}" = Linux ]; then
            elsewhere="clang_mcdc_oracle"
            tests_elsewhere=""
          else
            elsewhere="docker_servers docker_clients rust_region_container"
            tests_elsewhere="rust_runtime::tests::a_region_in_a_container_is_read_live_from_the_host"
          fi
          all=$(sed -n '/^gates! {/,/^}/p' crates/supercov-cli/tests/e2e_gates.rs \
            | grep -oE '^    [a-z0-9_]+ =>' | awk '{print $1}')
          gates=$(echo "$all" | grep -vxF -f <(echo "$elsewhere" | tr ' ' '\n'))
          slice=${{ matrix.slice }}
          # The Kotlin corpus test parses projects `kotlin-grammar` checks
          # out; it measures the vendored C grammar, not Supercov.
          corpus="every_file_of_the_corpus_parses_or_is_known_not_to"
          lists="$RUNNER_TEMP/slices"
          mkdir -p "$lists"
          echo "$gates" > "$lists/gates"
          printf '%s\n' $elsewhere $tests_elsewhere $corpus > "$lists/excluded"
          # Every gate and every test costing two seconds or more, dearest
          # first, each to the slice with the least so far. A test costs the
          # larger of the seconds it took in a run and the processor seconds
          # it and the children it waited for used (test-seconds.tsv, those of
          # main's newest run first, as the plan found them; a gate not timed
          # there costs its CI seconds, or a minute): tests share a
          # slice's four processors, and dealt by seconds alone, gates heavy
          # on all four landed together and each ran up to 3.5 times longer
          # than measured; processor seconds alone miss what a browser or a
          # container does. Slice 0 starts with the cheaper tests, which only
          # it runs, each with the fifth of a second Supercov spends between
          # them, and runs any test no run has timed yet.
          # Main's newest seconds, read after the committed ones: they win.
          fresh="$CI_TEST_SECONDS"
          [ -f "$fresh" ] || fresh=/dev/null
          awk -v n="$SLICES" -v s="$slice" -v lists="$lists" -v fresh="$fresh" '
            FILENAME == ".github/gate-seconds.tsv" { if ($0 !~ /^#/ && NF) gate_seconds[$1] = $2; next }
            FILENAME == ".github/test-seconds.tsv" || FILENAME == fresh { if ($0 !~ /^#/ && NF) test_seconds[$1] = $3 > $2 ? $3 : $2; next }
            FILENAME == lists "/excluded" { if (NF) excluded[$1] = 1; next }
            FILENAME == lists "/gates" {
              if (NF) {
                unit[++count] = $1; gate[$1] = 1
                cost[count] = ($1 in test_seconds) ? test_seconds[$1] : ($1 in gate_seconds) ? gate_seconds[$1] : 60
              }
              next
            }
            END {
              for (name in test_seconds) {
                if (name in excluded || name in gate) continue
                if (test_seconds[name] >= 2) { unit[++count] = name; cost[count] = test_seconds[name] }
                else load[0] += test_seconds[name] + 0.2
              }
              for (i = 1; i <= count; i++) order[i] = i
              for (i = 1; i <= count; i++) for (j = i + 1; j <= count; j++)
                if (cost[order[j]] > cost[order[i]] || (cost[order[j]] == cost[order[i]] && unit[order[j]] < unit[order[i]])) { t = order[i]; order[i] = order[j]; order[j] = t }
              for (i = 1; i <= count; i++) {
                best = 0
                for (k = 1; k < n; k++) if (load[k] < load[best]) best = k
                load[best] += cost[order[i]]
                if (s == 0 && best != 0) print "--skip " unit[order[i]]
                if (s != 0 && best == s) print unit[order[i]]
              }
              if (s == 0) for (name in excluded) print "--skip " name
            }' .github/gate-seconds.tsv .github/test-seconds.tsv "$fresh" "$lists/excluded" "$lists/gates" > "$lists/picked"
          # A slice dealt nothing runs nothing: no name at all would be every test.
          [ -s "$lists/picked" ] || echo "no_test_was_dealt_to_this_slice" > "$lists/picked"
          # A pull request's affected tests, this slice's share of them by
          # their seconds.
          if [ "$AFFECTED" = true ]; then
            names=$(node scripts/ci-affected.mjs cargo-test "$RUNNER_TEMP/affected/selection.json" "$slice" "$AFFECTED_SLICES")
            # Less what this platform cannot run: a change to the gates' file
            # picks every gate in it.
            names=$(printf '%s\n' $names | grep -vxF -f <(printf '%s\n' $elsewhere $tests_elsewhere) | tr '\n' ' ')
            [ -n "${names// }" ] || names=no_test_was_dealt_to_this_slice
            echo "command=cargo test --workspace -- --include-ignored --exact $names" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A targeted measurement runs the named tests alone, matched as
          # libtest matches a filter: by substring.
          if [ -n "$TARGET_TESTS" ]; then
            echo "command=cargo test --workspace -- --include-ignored $TARGET_TESTS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The whole workspace builds in every slice, so every run counts the
          # same files; only the tests named run, or all but those skipped.
          echo "command=cargo test --workspace -- --include-ignored --exact $(tr '\n' ' ' < "$lists/picked")" >> "$GITHUB_OUTPUT"
      - name: Measure
        env:
          TEST262_DIR: ${{ runner.temp }}/test262
          # Their tools are installed above: a gate may not skip for want of
          # them, where locally it says so and passes.
          SUPERCOV_REQUIRE_RUST_WASM: "1"
          SUPERCOV_REQUIRE_RUST_WORKER: "1"
          # Each gate's time, kept with the slice's run.
          SUPERCOV_GATE_TIMINGS: ${{ runner.temp }}/out/gate-timings.tsv
          # And each test's, and its processor seconds; the merged libtest
          # report sums only its seconds, per binary.
          TEST_SECONDS: ${{ runner.temp }}/out/test-seconds.tsv
        run: |
          chmod +x "$RUNNER_TEMP/self/supercov"
          echo "${{ steps.tests.outputs.command }}"
          mkdir -p "$RUNNER_TEMP/out"
          log="$RUNNER_TEMP/out/measure.log"
          # Supercov runs each test as its binary given `--exact NAME`, through
          # the target runner a command configures: this one times each.
          # Given only on the command line, it reaches no project a test
          # runs Cargo in itself.
          timer="$RUNNER_TEMP/time-test.sh"
          cat > "$timer" <<'EOF'
          #!/usr/bin/env bash
          name=""; previous=""
          for argument in "$@"; do
            [ "$argument" = --list ] && exec "$@"
            [ "$previous" = --exact ] && name=$argument
            previous=$argument
          done
          [ -n "$name" ] || exec "$@"
          # Its seconds and the processor seconds it and its children used:
          # tests run side by side, so what one costs a slice is the latter.
          TIMEFORMAT='%R %U %S'
          report=$(mktemp)
          { time "$@" 2>&3; } 3>&2 2>"$report"
          status=$?
          read -r real user system < "$report"
          rm -f "$report"
          awk -v name="$name" -v real="$real" -v cpu="$(awk -v u="$user" -v s="$system" 'BEGIN { print u + s }')" \
            'BEGIN { printf "%s\t%.1f\t%.1f\n", name, real, cpu }' >> "$TEST_SECONDS"
          exit $status
          EOF
          chmod +x "$timer"
          host=$(rustc -vV | sed -n 's/^host: //p')
          command="${{ steps.tests.outputs.command }}"
          # A failing test still leaves a run to merge; the merge says it failed.
          "$RUNNER_TEMP/self/supercov" -- cargo test --config "target.$host.runner=\"$timer\"" ${command#cargo test } 2>&1 | tee "$log"
          echo "exit ${PIPESTATUS[0]}" | tee -a "$log"
      - name: Keep the run
        if: always()
        run: |
          run=$(ls -t .supercov/runs | head -1)
          tar -C .supercov/runs -czf "$RUNNER_TEMP/out/run.tar.gz" "$run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-${{ matrix.os }}-${{ matrix.slice }}
          path: ${{ runner.temp }}/out
          retention-days: 7
      - name: Fail the slice when a test failed
        run: grep -qx 'exit 0' <(tail -1 "$RUNNER_TEMP/out/measure.log")

  # After slices that failed too, to say what they covered; not after a run
  # that was cancelled (a newer push, a failure elsewhere on the commit),
  # whose slices left nothing to merge, and whose merge then failed as well.
  merge:
    needs: [plan, platforms, measure]
    if: ${{ !cancelled() && needs.measure.result != 'skipped' }}
    name: Merge ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      AFFECTED: ${{ fromJSON(needs.plan.outputs.jobs).measure.mode == 'partial' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The merge's base too: a pull request's changed lines are read
          # against it.
          fetch-depth: 2
      - uses: actions/download-artifact@v5
        with:
          name: supercov-self-${{ matrix.os }}
          path: ${{ runner.temp }}/self
      - uses: actions/download-artifact@v5
        with:
          pattern: run-${{ matrix.os }}-*
          path: ${{ runner.temp }}/runs
      - name: Merge the slices
        env:
          TARGET_FILES: ${{ inputs.files }}
        run: |
          supercov="$RUNNER_TEMP/self/supercov"
          chmod +x "$supercov"
          out="$RUNNER_TEMP/out"
          mkdir -p .supercov/runs "$out"
          # Each slice's files, wherever the download put them: in a folder of
          # the slice's name, or, when only one slice ran, straight in runs/.
          slices=$(find "$RUNNER_TEMP/runs" -name run.tar.gz -exec dirname {} \; | sort)
          for slice in $slices; do
            tar -C .supercov/runs -xzf "$slice/run.tar.gz"
            echo "$(basename "$slice"): $(tail -1 "$slice/measure.log")"
          done
          ids=$(ls .supercov/runs)
          if [ "$(echo "$ids" | wc -w)" -eq 1 ]; then
            # One slice (a targeted measurement) is its own whole run.
            echo "merged run $ids" | tee "$out/merge.log"
          else
            "$supercov" merge $ids 2>&1 | tee "$out/merge.log"
          fi
          merged=$(grep -oE 'merged run run_[0-9a-f]{16}' "$out/merge.log" | awk '{print $3}')
          if [ -z "$merged" ]; then echo "the slices did not merge"; exit 1; fi
          echo "$merged" > "$out/merged-id"
          "$supercov" runs "$merged" > "$out/summary.txt"
          for metric in mcdc lines branches; do
            "$supercov" runs "$merged" gaps --format jsonl --metric "$metric" --limit 0 --output "$out/$metric-gaps.jsonl"
          done
          # The gaps left in the files a targeted measurement was for.
          if [ -n "$TARGET_FILES" ]; then
            {
              echo "### Gaps in ${TARGET_FILES}"
              echo '```'
              for metric in lines branches mcdc; do
                for prefix in $TARGET_FILES; do
                  jq -r --arg p "$prefix" 'select(.file | startswith($p)) | .file' "$out/$metric-gaps.jsonl"
                done | sort | uniq -c | sed "s/^/$metric /"
              done
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            for slice in $slices; do
              echo "$(basename "$slice"): $(tail -1 "$slice/measure.log")"
            done
            echo
            cat "$out/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-coverage-${{ matrix.os }}
          path: ${{ runner.temp }}/out
          retention-days: 30
      # The gaps are in the artifact above, one file per metric. `check`
      # compares counts, so 99.995% fails, and it answers 2 rather than pass
      # when a slice's tests failed or the run no longer matches the commit.
      # A targeted measurement ran only some tests: it shows what they cover,
      # not what the whole suite leaves, so it holds no floor.
      - name: Hold Supercov to 100% coverage
        if: inputs.tests == '' && env.AFFECTED != 'true'
        run: |
          "$RUNNER_TEMP/self/supercov" runs "$(cat "$RUNNER_TEMP/out/merged-id")" check \
            --min-lines 100 --min-branches 100 --min-mcdc 100
      # A pull request measured in part: the lines it adds or changes held to
      # 100% lines, branches and MC/DC by the affected tests. Every other line
      # is covered as it was on main, where every test runs and the whole is
      # held to 100%.
      - name: Hold the changed lines to 100% coverage
        if: env.AFFECTED == 'true'
        run: node scripts/ci-affected.mjs changed-gaps HEAD^1 "$RUNNER_TEMP/out"/lines-gaps.jsonl "$RUNNER_TEMP/out"/branches-gaps.jsonl "$RUNNER_TEMP/out"/mcdc-gaps.jsonl
      # Each test's seconds and processor seconds in this full measurement,
      # a name in several slices summed: CI's plan hands them to every job
      # that deals tests by their time (.github/actions/affected).
      - name: Keep the test seconds
        if: github.event_name != 'pull_request' && inputs.tests == '' && matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$RUNNER_TEMP/seconds"
          find "$RUNNER_TEMP/runs" -name test-seconds.tsv -exec cat {} + \
            | awk -F'\t' '{ w[$1] += $2; c[$1] += $3 } END { for (n in w) printf "%s\t%.1f\t%.1f\n", n, w[n], c[n] }' \
            | LC_ALL=C sort > "$RUNNER_TEMP/seconds/test-seconds.tsv"
          wc -l "$RUNNER_TEMP/seconds/test-seconds.tsv"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && inputs.tests == '' && matrix.os == 'ubuntu-latest'
        with:
          name: test-seconds
          path: ${{ runner.temp }}/seconds/test-seconds.tsv
          retention-days: 90
      # main's measurement (or a full one by hand), kept as the map CI's plan
      # reads: the runs (without
      # what only queries read) and the build that answers for them.
      - name: Keep the map
        if: github.event_name != 'pull_request' && inputs.tests == '' && matrix.os == 'ubuntu-latest'
        run: |
          map="$RUNNER_TEMP/map"
          mkdir -p "$map"
          tar -czf "$map/map.tar.gz" --exclude='query-index.v1.bin*' --exclude='assessment-input.json.gz' --exclude='statement-spans.json' .supercov/runs
          cp "$RUNNER_TEMP/self/supercov" "$map/supercov"
          cp "$RUNNER_TEMP/out/merged-id" "$map/merged-id"
          du -sh "$map"/*
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && inputs.tests == '' && matrix.os == 'ubuntu-latest'
        with:
          name: affected-map
          path: ${{ runner.temp }}/map
          retention-days: 30
