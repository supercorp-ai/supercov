name: Compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 25]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node ../../../bin/supercov.js -- npm test
        working-directory: tests/fixtures/no-build-node

  runners:
    name: ${{ matrix.name }} runners
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            playwright: 1.55.1
            vite: 5.4.19
            vitest: 2.1.9
          - name: current
            playwright: 1.62.1
            vite: 8.2.2
            vitest: 4.1.11
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select runner versions
        env:
          PLAYWRIGHT_VERSION: ${{ matrix.playwright }}
          VITE_VERSION: ${{ matrix.vite }}
          VITEST_VERSION: ${{ matrix.vitest }}
        run: npm install --no-save "@playwright/test@$PLAYWRIGHT_VERSION" "vite@$VITE_VERSION" "vitest@$VITEST_VERSION"
      # The fixture matrix drives Chromium, Firefox and WebKit.
      - run: npx playwright install --with-deps
      - run: npm run test:fixture

  browsers:
    name: Playwright ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run build
      - run: node ../../../bin/supercov.js -- npm test
        working-directory: tests/fixtures/generic-playwright
        env:
          SUPERCOV_BROWSER: ${{ matrix.browser }}

  filesystems:
    name: Filesystem safety (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: npm ci
      # The only clippy pass that sees Windows- and macOS-only code.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm run test:filesystem
      - run: npm run test:platform

  python:
    name: CPython ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:python-monitoring
        env:
          SUPERCOV_PYTHON: python

  ruby:
    name: Ruby ${{ matrix.ruby }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
        # 3.3 measures through Coverage alone and declares the rest; 3.4 is
        # the first version the probes can measure everything on.
        ruby: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run test:ruby-coverage

  rust:
    name: Rust suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # The libtest companion patches the toolchain's own library/test source.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - run: npm ci
      - run: npm run test:rust-public-cargo

  # The binary we ship, on the machine it is shipped for. Three of the eight
  # native packages had never executed anywhere but the cross-compiler.
  released:
    name: Released binary (${{ matrix.native }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { native: cli-linux-x64-gnu, os: ubuntu-latest }
          - { native: cli-linux-arm64-gnu, os: ubuntu-24.04-arm }
          - { native: cli-linux-x64-musl, os: ubuntu-latest, container: "node:22-alpine" }
          - { native: cli-linux-arm64-musl, os: ubuntu-24.04-arm, container: "node:22-alpine" }
          - { native: cli-darwin-arm64, os: macos-latest }
          - { native: cli-darwin-x64, os: macos-15-intel }
          - { native: cli-win32-x64, os: windows-latest }
          - { native: cli-win32-arm64, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v6
      # The Alpine image brings its own Node; setup-node has no musl build.
      - if: ${{ !matrix.container }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/released-binary-smoke.mjs
        env:
          SUPERCOV_EXPECTED_NATIVE: ${{ matrix.native }}

