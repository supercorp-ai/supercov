name: React compatibility

# The slow tier's (slow-tier.yml): a pull request ready to merge, every push
# to a release pull request, and each night on main, the jobs a pull request
# never runs among them -- a gate whose own pull requests are rare goes stale
# where nothing runs it, and a release then finds it broken. Whether the
# change can affect the focused job is the plan's to say.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # The stop-on-failure step cancels this commit's runs.
  actions: write

concurrency:
  group: react-compatibility-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  # Whether this change can affect the job (scripts/ci-affected.mjs), as in
  # CI: the step summary says why it runs or not.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.affected.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: affected
        uses: ./.github/actions/affected
        with:
          workflow: react

  focused:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.jobs)['focused'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      # One Rust cache for every job on this toolchain, kept by main
      # (dependency-caches.yml), never saved by a pull request: each job
      # saving its own, per pull request, filled the 10 GB the repository
      # has and evicted main's caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      # Chromium's system libraries, once and from the Actions cache (fetched
      # from the Ubuntu mirror, they took six minutes of a run), and the
      # Chromium of each Playwright pinned: the repository's and the
      # example's, read from its lockfile. `test:react` installs the
      # example's packages itself.
      - uses: ./.github/actions/system-packages
        with:
          command: npx playwright install-deps chromium
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          prefix: apt-chromium-${{ runner.os }}-${{ runner.arch }}-
      - run: |
          npx playwright install chromium
          npx -y "playwright@$(jq -r '.packages["node_modules/playwright-core"].version' examples/react-verification/package-lock.json)" install chromium
      # The runtime tests and the direct Jest and Vitest scripts run in CI.
      - run: cargo build -p supercov
      - run: npm run test:react
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-example-node-${{ matrix.node }}
          path: examples/react-verification/recorded
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  native:
    # Not on a pull request ready to merge or the merge queue's commit, but on
    # a release's, and each night.
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p supercov
      - run: node scripts/react-native-compatibility.mjs
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  real-apps:
    # Not on a pull request ready to merge or the merge queue's commit, but on
    # a release's, and each night.
    if: (github.event_name != 'pull_request' && github.event_name != 'merge_group') || startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo build -p supercov
      - run: SUPERCOV_REACT_AUDIT_DIR="$RUNNER_TEMP/react-app-audit" node scripts/react-real-apps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-react-apps
          path: |
            ${{ runner.temp }}/react-app-audit/*.log
            ${{ runner.temp }}/react-app-audit/*-summary.json
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure
