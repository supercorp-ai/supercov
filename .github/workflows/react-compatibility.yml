name: React compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * *'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo*'
      - 'runtime/javascript/**'
      - 'scripts/**'
      - 'tests/**'
      - 'examples/react-verification/**'
      - 'package*.json'
      - '.github/workflows/react-compatibility.yml'

permissions:
  contents: read
  # The stop-on-failure step cancels this commit's runs.
  actions: write

concurrency:
  group: react-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          # The two Node versions build the same Rust: one cache.
          shared-key: react-focused
          save-if: ${{ matrix.node == 24 }}
      - run: npm ci
      # Chromium's system libraries, once and from the Actions cache (fetched
      # from the Ubuntu mirror, they took six minutes of a run), and the
      # Chromium of each Playwright pinned: the repository's and the
      # example's, read from its lockfile. `test:react` installs the
      # example's packages itself.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: |
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\n' "$HOME/apt-archives" \
            | sudo tee /etc/apt/apt.conf.d/99kept-archives > /dev/null
          npx playwright install --with-deps chromium
          sudo chown -R "$USER" ~/apt-archives
          npx -y "playwright@$(jq -r '.packages["node_modules/playwright-core"].version' examples/react-verification/package-lock.json)" install chromium
      # The runtime tests and the direct Jest and Vitest scripts run in CI.
      - run: cargo build -p supercov
      - run: npm run test:react
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: react-example-node-${{ matrix.node }}
          path: examples/react-verification/recorded
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  native:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p supercov
      - run: node scripts/react-native-compatibility.mjs
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  real-apps:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo build -p supercov
      - run: SUPERCOV_REACT_AUDIT_DIR="$RUNNER_TEMP/react-app-audit" node scripts/react-real-apps.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-react-apps
          path: |
            ${{ runner.temp }}/react-app-audit/*.log
            ${{ runner.temp }}/react-app-audit/*-summary.json
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure
