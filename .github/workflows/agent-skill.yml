name: Agent skill

# Runs the plugin's eval suite, with the plugin loaded and without it, so a
# change to the skill, to the guides it points agents at, or a new model cannot
# quietly make the skill fire less or steer worse. The commands the skill names
# are checked on every pull request by `npm run check`; this measures what an
# agent does with them, which needs a model and costs money, so it runs only
# when the skill or those guides change.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - "plugins/**"
      - "docs/agent-loop.md"
      - "docs/quality.md"
      - "docs/security.md"

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without credentials
        id: credentials
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set for this repository; agent skill evals skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.skip != 'true'
        uses: actions/checkout@v6
      - if: steps.credentials.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
      # The eval runner sandboxes every Bash call and refuses to run without a
      # sandbox backend; on Linux that is bubblewrap and socat.
      - if: steps.credentials.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat
      - if: steps.credentials.outputs.skip != 'true'
        run: npm install --global @anthropic-ai/claude-code
      - if: steps.credentials.outputs.skip != 'true'
        run: npm run eval:skill -- --json plugins/supercov/evals/results/ci.json
      - if: always() && steps.credentials.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: agent-skill-evals
          path: plugins/supercov/evals/results/
          if-no-files-found: ignore
