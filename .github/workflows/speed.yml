name: Speed

# How much longer real applications' tests and builds take under Supercov
# than without it, for the pull request's base and its head on one machine, taking
# turns (scripts/speed-benchmark.mjs). Add the `speed` label to a pull request;
# each push to a labelled pull request measures again.

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: contains(github.event.pull_request.labels.*.name, 'speed')
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - variant: base
            ref: ${{ github.event.pull_request.base.sha }}
          - variant: new
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: speed-${{ matrix.variant }}
      # Line tables and symbols, for the diagnostic pass's native profile.
      - run: cargo build --profile measure -p supercov
        env:
          CARGO_PROFILE_MEASURE_DEBUG: line-tables-only
          CARGO_PROFILE_MEASURE_STRIP: none
      - uses: actions/upload-artifact@v4
        with:
          name: supercov-${{ matrix.variant }}
          path: target/measure/supercov
          retention-days: 3

  measure:
    needs: build
    name: Measure ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: bulletproof
            label: bulletproof
            node: 22
            rounds: 3
            diagnose: 1
            binaries: base=binaries/supercov-base/supercov,new=binaries/supercov-new/supercov
          # 170 Playwright tests on one worker, against plain alone: a Supercov
          # without f8f3d872 cannot build it (its instrumentation.ts guards
          # Node-only imports with NEXT_RUNTIME). Three rounds for the ratio
          # on one runner, and the diagnostic pass on another beside it.
          - app: rallly
            label: rallly
            node: 24
            rounds: 3
            diagnose: 0
            binaries: new=binaries/supercov-new/supercov
          # The same on a second runner: runners differ, and the ratio with
          # them, by more than a change of a few seconds moves it.
          - app: rallly
            label: rallly-second
            node: 24
            rounds: 3
            diagnose: 0
            binaries: new=binaries/supercov-new/supercov
          # A large Vite app: its Vitest suite and its production build.
          - app: excalidraw
            label: excalidraw
            node: 22
            rounds: 3
            diagnose: 1
            binaries: base=binaries/supercov-base/supercov,new=binaries/supercov-new/supercov
          - app: rallly
            label: rallly-diagnose
            node: 24
            rounds: 1
            diagnose: 1
            binaries: new=binaries/supercov-new/supercov
    # Rallly's tests reach Postgres and Mailpit where its .env.test says.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rallly
        ports:
          - 5450:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          pattern: supercov-*
          path: binaries
      - run: chmod +x binaries/*/supercov
      # Which machine this was: the ratio moves with it.
      - run: nproc && lscpu | grep -E 'Model name|MHz' | head -3 | tee "$RUNNER_TEMP/machine.txt"
      - run: npx -y playwright@1.49.1 install-deps chromium
      # samply, for a native profile of Supercov's own work.
      # Optional: a download that fails leaves the pass without it.
      - if: matrix.diagnose == 1
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/samply"
          # The release binary, or built from crates.io when GitHub's release
          # downloads fail.
          curl -fsSL https://github.com/mstange/samply/releases/download/samply-v0.13.1/samply-x86_64-unknown-linux-gnu.tar.xz | tar -xJ -C "$RUNNER_TEMP/samply" \
            || cargo install samply --version 0.13.1 --locked --root "$RUNNER_TEMP/samply"
          echo "SPEED_SAMPLY=$(find "$RUNNER_TEMP/samply" -name samply -type f | head -1)" >> "$GITHUB_ENV"
          sudo sysctl kernel.perf_event_paranoid=1
      - name: Measure
        env:
          SUPERCOV_BINARIES: ${{ matrix.binaries }}
          SPEED_APP: ${{ matrix.app }}
          SPEED_ROUNDS: ${{ matrix.rounds }}
          SPEED_REPEAT: 10
          SPEED_OUTPUT: ${{ runner.temp }}/speed
          SPEED_DIAGNOSE: ${{ matrix.diagnose }}
        run: node scripts/speed-benchmark.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/speed/samples.jsonl
            ${{ runner.temp }}/speed/summary.md
            ${{ runner.temp }}/speed/report-*.json
            ${{ runner.temp }}/speed/bundles.txt
            ${{ runner.temp }}/speed/samples/
            ${{ runner.temp }}/speed/samply-*
            ${{ runner.temp }}/speed/profile.md
            ${{ runner.temp }}/speed/profile-top-*.txt
            ${{ runner.temp }}/speed/profile-processes-*.txt
            ${{ runner.temp }}/speed/profile-callers-*.txt
            ${{ runner.temp }}/speed/browser-profile-*
            ${{ runner.temp }}/speed/logs/
            ${{ runner.temp }}/speed/results/**/trace.zip
          retention-days: 7
