name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  native-artifacts:
    uses: ./.github/workflows/native-artifacts.yml
    permissions:
      contents: read

  publish:
    needs: [release-check, native-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Require a matching version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== "v" + version) { console.error(`Expected tag v${version}, received ${process.env.RELEASE_TAG}`); process.exit(1); }'
      - uses: actions/download-artifact@v8
        with:
          name: supercov-native-release-set
          path: native-release
      - run: npm ci
      # The release commit is validated locally before tagging. Build the exact
      # tarball inputs here, then suppress npm lifecycle scripts so publication
      # does not repeat the full local release and oracle suites.
      - run: npm run build
      - name: Revalidate and publish every exact-version native package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/verify-native-release-set.mjs native-release
          node scripts/publish-native-release.mjs native-release
      - name: Publish the primary package only after every native package exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --access public
