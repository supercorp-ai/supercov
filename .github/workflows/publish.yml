name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: Build only the two Windows targets and reuse another run for the rest
        required: false
        type: boolean
        default: false
      reuse-run-id:
        description: Prior native-artifact workflow run containing already validated targets
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  native-artifacts:
    uses: ./.github/workflows/native-artifacts.yml
    with:
      matrix-json: ${{ inputs.windows-only && '{"include":[{"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","package":"supercov-win32-arm64","executable":"supercov.exe","packedInstall":true},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","package":"supercov-win32-x64","executable":"supercov.exe","packedInstall":true}]}' || '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","package":"supercov-darwin-arm64","executable":"supercov","packedInstall":true},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"supercov-darwin-x64","executable":"supercov","packedInstall":true},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","package":"supercov-linux-arm64-gnu","executable":"supercov","packedInstall":true},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"supercov-linux-x64-gnu","executable":"supercov","packedInstall":true},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","package":"supercov-linux-arm64-musl","executable":"supercov","musl":true},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","package":"supercov-linux-x64-musl","executable":"supercov","musl":true},{"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","package":"supercov-win32-arm64","executable":"supercov.exe","packedInstall":true},{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","package":"supercov-win32-x64","executable":"supercov.exe","packedInstall":true}]}' }}
      reuse-run-id: ${{ inputs.reuse-run-id }}
    permissions:
      actions: read
      contents: read

  publish:
    needs: native-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Require a matching version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== "v" + version) { console.error(`Expected tag v${version}, received ${process.env.RELEASE_TAG}`); process.exit(1); }'
      - uses: actions/download-artifact@v8
        with:
          name: supercov-native-release-set
          path: native-release
      - run: npm ci
      # The release commit is validated locally before tagging. Build the exact
      # tarball inputs here, then suppress npm lifecycle scripts so publication
      # does not repeat the full local release and oracle suites.
      - run: npm run build
      - name: Revalidate and publish every exact-version native package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/verify-native-release-set.mjs native-release
          node scripts/publish-native-release.mjs native-release
      - name: Publish the primary package only after every native package exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --access public
