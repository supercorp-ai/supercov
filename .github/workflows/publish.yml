name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: test "$RELEASE_REF_TYPE" = tag
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm run build
      - run: npm run test:embedded-runtime
      - run: npm run test:rust-assets

  native-artifacts:
    needs: release-check
    uses: ./.github/workflows/native-artifacts.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    needs: [release-check, native-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Require a matching version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const version = require("./package.json").version; if (process.env.RELEASE_TAG !== "v" + version) { console.error(`Expected tag v${version}, received ${process.env.RELEASE_TAG}`); process.exit(1); }'
      - uses: actions/download-artifact@v8
        with:
          name: supercov-native-release-set
          path: native-release
      - run: npm ci
      # The release commit is validated locally before tagging and by the
      # compact release gate above. Build the exact tarball inputs here, then
      # suppress npm lifecycle scripts so publication does not repeat the full
      # local release and oracle suites.
      - run: npm run build
      - name: Revalidate and publish every exact-version native package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/verify-native-release-set.mjs native-release
          node scripts/publish-native-release.mjs native-release
      - name: Publish the primary package only after every native package exists
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --access public
