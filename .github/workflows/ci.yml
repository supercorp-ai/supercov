name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install the independent Clang/LLVM MC/DC oracle
        run: sudo apt-get update -qq && sudo apt-get install -y clang llvm
      - run: npm ci
      - run: npm run release:check
      - run: npm run test:rust-engine
      - uses: actions/checkout@v6
        with:
          repository: tc39/test262
          ref: 3655e7464de3d52643ecddd4b5f9f4f3e7f62398
          path: .test262
      - name: Test262 semantic-equivalence smoke gate
        env:
          SUPERCOV_RUST_BINARY: ${{ github.workspace }}/target/release/supercov
        run: node scripts/test262-equivalence.mjs --engine rust --test262 .test262 --limit 250 --minimum 200
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:fixture
      - run: npm run test:rust-fixture
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Require Rust syntax equivalence on the oldest supported Node
        env:
          SUPERCOV_RUST_BINARY: ${{ github.workspace }}/target/release/supercov
        run: node scripts/rust-syntax-matrix.mjs --runtime node
