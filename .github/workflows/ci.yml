name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm --prefix analyzers/typescript ci --ignore-scripts
      - run: node scripts/asserted-compiler-probe.mjs
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm --prefix analyzers/typescript ci --ignore-scripts
      - run: npm run check
