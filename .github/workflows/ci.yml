name: CI

# The fast tier: every push to a pull request, drafts included, says in about
# ten minutes whether its build, lint and affected tests pass, as the `Fast
# tier` status. The slow tier (slow-tier.yml: Self Coverage, Compatibility,
# React, Next.js and the release gates) runs in the merge queue.
# CONTRIBUTING.md says how each is asked for.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated jobs to run (check, bun-bootstrap, launch-arguments, lint, engine-integrations, clang-mcdc-oracle, kotlin-grammar, rust-worker, rust-wasm-js, rust-wasm). Empty runs them all."
        default: ""
        type: string
  # The gate every change is expected to pass, on the change itself. It ran
  # only when someone remembered to ask for it, which meant a pull request's
  # green tick said the React jobs had passed and nothing
  # about `cargo fmt`, clippy, the workspace tests or the packaged assets.
  # A pull request runs on Linux alone, the tests its change can affect; the
  # `full-ci` label, or a release pull request, runs every job on every
  # platform (scripts/ci-affected.mjs).
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The merge queue's commit: the pull request on main as main is now. Its
  # `Fast tier` status, on that commit, is what the queue waits for before it
  # merges (scripts/ci-tiers.mjs).
  merge_group:
    types: [checks_requested]
  # The fast tier each night on main, every job on every platform: a gate
  # whose own pull requests are rare goes stale where nothing runs it, and a
  # release then finds it broken. Its `Fast tier` status on main's commit is
  # what a release of that commit reads (publish.yml).
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: read
  # The stop-on-failure step cancels this commit's runs.
  actions: write

# A newer push to a pull request, or a newer run started by hand on the same
# branch for the same jobs, replaces the one before: an iteration that asked
# again no longer waits behind its own stale run.
# A label other than `full-ci` is a run of its own that runs nothing, so it
# cancels nothing.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.only }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  # Which jobs this change can affect (scripts/ci-affected.mjs): on a pull
  # request, the jobs whose tests Self Coverage's map of main says the change
  # can reach, and only those tests; everything on a run by hand, a release
  # pull request, a change to CI itself, or when the map cannot answer. The
  # step summary says why each job runs in full, in part, or not at all.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.affected.outputs.jobs }}
      mode: ${{ steps.affected.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: affected
        uses: ./.github/actions/affected
        with:
          workflow: ci

  check:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',check,')) && fromJSON(needs.plan.outputs.jobs)['check'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every supported Node, here only: the Compatibility workflow's Node
        # jobs ran the same check again on 22 and 24.
        node: ${{ fromJSON(needs.plan.outputs.jobs).check.matrix.node }}
        # The tests in parts that take about as long, dealt by the seconds
        # each took in main's newest Self Coverage run (scripts/ci-affected.mjs
        # nextest): the affected ones in as many parts as keep each to a few
        # minutes, or every test in three. Split by a hash of their names,
        # the affected tests' one part took fifteen minutes and a half of
        # every test eighteen, the other half eight.
        part: ${{ fromJSON(needs.plan.outputs.jobs).check.matrix.part }}
    env:
      AFFECTED: ${{ fromJSON(needs.plan.outputs.jobs).check.mode == 'partial' }}
      PARTS: ${{ fromJSON(needs.plan.outputs.jobs).check.parts || 1 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # One Rust cache for every job on this toolchain, kept by main
      # (dependency-caches.yml), never saved by a pull request: each job
      # saving its own, per pull request, filled the 10 GB the repository
      # has and evicted main's caches.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # What the JVM tests' Maven and Gradle fetch, kept: fetched every run, a
      # plugin Maven Central did not serve failed a test on 2026-11-05. And
      # their own retries turned up for what is still fetched.
      - uses: ./.github/actions/jvm-dependencies
        with:
          step: restore
      - run: npm ci
      # This part's share of the affected tests and every test of a file the
      # change touched (a test new since the map is in one), or of every
      # test: a nextest profile of them alone, named by --profile, as
      # NEXTEST_PROFILE would reach the nextest a test starts in its own
      # fixture, which has no such profile.
      - uses: actions/download-artifact@v5
        with:
          name: affected-selection-ci
      - run: |
          cargo nextest list --workspace --message-format json > "$RUNNER_TEMP/tests.json"
          CI_TEST_SECONDS="$PWD/test-seconds.tsv" node scripts/ci-affected.mjs nextest selection.json "$RUNNER_TEMP/tests.json" ${{ matrix.part }} "$PARTS" ${{ env.AFFECTED != 'true' && '--all' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
      # Formatting and clippy are the same on every Node: the lint job's.
      # A test that fails runs once more: one that then passes is flaky, and
      # is named (below, and on the tracking issue) rather than failing the
      # job; one that fails twice fails it, on a release as anywhere.
      - run: cargo nextest run --workspace --profile affected --retries 1 --no-fail-fast --no-tests=pass
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/flaky-tests
        with:
          job: check (${{ matrix.node }}, ${{ matrix.part }})
          id: check-${{ matrix.node }}-${{ matrix.part }}
      # Doctests, which nextest does not run, and the tooling checks: with
      # the first part, which is dealt that much less of the tests.
      - if: matrix.part == 1
        run: cargo test --workspace --doc && npm run check:tooling
      # What this run fetched, kept for the next, even after a failure; by
      # one Node of the three, which fetch the same.
      - if: ${{ !cancelled() && matrix.node == 24 }}
        uses: ./.github/actions/jvm-dependencies
        with:
          step: save
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # Bun ignores the Node preload, so verify source bootstrapping with the
  # reported version and an older Bun release on both host platforms.
  bun-bootstrap:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',bun-bootstrap,')) && fromJSON(needs.plan.outputs.jobs)['bun-bootstrap'].run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Linux on a pull request; macOS too on a release, main and `full-ci`.
        os: ${{ fromJSON(needs.plan.outputs.jobs)['bun-bootstrap'].os }}
        bun: [1.2.17, 1.4.4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: dtolnay/rust-toolchain@1.95.0
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p supercov --test cli bun_
        env:
          SUPERCOV_REQUIRE_BUN: "1"
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # What each way of starting Supercov hands its binary: the packed npm
  # package installed by npm, pnpm, Yarn 1 and 4 and Bun, started by their
  # scripts, `exec`/`x` commands and shims from sh, cmd and PowerShell, the
  # gem's wrapper, the wheel through uv and pipx, and `go run`. Bun, Yarn 1
  # and PowerShell each drop a `--` on the way (#209); real suites are
  # measured through them end to end.
  launch-arguments:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',launch-arguments,')) && fromJSON(needs.plan.outputs.jobs)['launch-arguments'].run }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Linux on a pull request; every platform on a release, main and
        # `full-ci`.
        os: ${{ fromJSON(needs.plan.outputs.jobs)['launch-arguments'].os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # A version, not the latest: asking GitHub's API for the latest
      # release timed out on 2026-11-24 and failed the job before its tests.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: corepack enable
      - run: cargo build -p supercov
      - run: node scripts/launch-arguments-integration.mjs --binary target/debug/supercov${{ runner.os == 'Windows' && '.exe' || '' }}
        env:
          SUPERCOV_REQUIRE_LAUNCHERS: "1"
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # `cargo fmt` and clippy, once: each Node's check job ran them again.
  lint:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',lint,')) && fromJSON(needs.plan.outputs.jobs)['lint'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm run check:lint
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # The twelve integration scripts that drive the public wrapper, process
  # supervision and every JavaScript runner. They lived only in `test:engine`,
  # which nothing but a release chain runs, so a stale assertion in one of them
  # sat in main through the 1.0.1 release and was found by the 1.1.0 release
  # chain -- the worst moment to find it. They run on the change now.
  #
  # Four groups side by side, each about a quarter of the scripts' time
  # (scripts/engine-integrations-group.mjs): one after another they took
  # twelve minutes, the longest job of a run.
  engine-integrations:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',engine-integrations,')) && fromJSON(needs.plan.outputs.jobs)['engine-integrations'].run }}
    name: engine-integrations (${{ matrix.group }}/${{ matrix.groups }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Four groups of every script, or as few as hold the affected ones.
      matrix: ${{ fromJSON(needs.plan.outputs.jobs)['engine-integrations'].matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          # The import gate reads an LLVM profile with llvm-profdata and llvm-cov.
          components: llvm-tools
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The Ruby server gate measures a Puma app; Supercov measures Ruby 3.3
      # and newer, and the runner's own Ruby is older.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The Go server gate builds its server with `go run`.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # The Java server gate compiles its server with `javac`.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # The scripts drive Chromium alone: only its system libraries, not
      # Firefox's and WebKit's media stack, and those kept in the Actions
      # cache. Fetched every run, one mirror served them at tens of kB/s and
      # held a group for half an hour.
      - uses: ./.github/actions/system-packages
        with:
          command: npx playwright install-deps chromium
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          prefix: apt-chromium-${{ runner.os }}-${{ runner.arch }}-
      - run: npx playwright install chromium
      # What the Java scripts' Maven builds fetch, kept; Maven Central refused
      # a plugin with HTTP 429 on 2026-11-23 and failed a group.
      - uses: ./.github/actions/jvm-dependencies
        with:
          step: restore
      - run: node scripts/engine-integrations-group.mjs ${{ matrix.group }} ${{ matrix.groups }}
        env:
          # The affected scripts alone, where the plan picked some.
          AFFECTED_SCRIPTS: ${{ fromJSON(needs.plan.outputs.jobs)['engine-integrations'].scripts }}
          SUPERCOV_REQUIRE_LLVM_TOOLS: "1"
          # mutations.xml is read by PIT's own reader, with this job's Java.
          SUPERCOV_REQUIRE_PIT_READER: "1"
      - if: matrix.group == 1 && (fromJSON(needs.plan.outputs.jobs)['engine-integrations'].mode == 'full' || fromJSON(needs.plan.outputs.jobs)['engine-integrations'].browser)
        run: cargo test -p supercov --test cli a_browser_worker_bootstraps_when_playwright_is_launched_by_a_unit_test
        env:
          SUPERCOV_REQUIRE_BROWSER: "1"
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/jvm-dependencies
        with:
          step: save
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # clang's own MC/DC as the oracle for Supercov's: the golden file was made
  # with Apple's toolchain, which the script finds through `xcrun`.
  clang-mcdc-oracle:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',clang-mcdc-oracle,')) && fromJSON(needs.plan.outputs.jobs)['clang-mcdc-oracle'].run }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:clang-mcdc
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # The Kotlin grammar Supercov keeps: its parser is what its grammar
  # generates, and real projects' files parse with it, but for the ones
  # `scripts/kotlin-corpus-failures.txt` names.
  kotlin-grammar:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',kotlin-grammar,')) && fromJSON(needs.plan.outputs.jobs)['kotlin-grammar'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@1.95.0
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: node scripts/kotlin-grammar.mjs --check
      - run: node scripts/kotlin-corpus.mjs
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # A Rust Worker under `wrangler dev`, measured through wrangler's inspector.
  rust-worker:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',rust-worker,')) && fromJSON(needs.plan.outputs.jobs)['rust-worker'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One job per gate, side by side: one after another they were the
        # slowest job of the workflow.
        gate: ${{ fromJSON(needs.plan.outputs.jobs)['rust-worker'].matrix.gate }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # install-action has no build of worker-build: compiled once per
      # version and kept, rather than compiled in every run.
      - id: worker-build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/worker-build
          key: worker-build-0.8.7-${{ runner.os }}-${{ runner.arch }}
      - if: steps.worker-build.outputs.cache-hit != 'true'
        run: cargo install worker-build --version 0.8.7 --locked
      # The cargo-test gate runs its Worker under `cargo nextest run` too.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - run: npm ci
      - run: cargo build -p supercov
      - run: node scripts/${{ matrix.gate }}.mjs
        env:
          SUPERCOV_REQUIRE_RUST_WORKER: "1"
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # Rust compiled to wasm that JavaScript tests load: node:test through the
  # nodejs glue, Playwright from a web page.
  rust-wasm-js:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',rust-wasm-js,')) && fromJSON(needs.plan.outputs.jobs)['rust-wasm-js'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Published builds, where `cargo install` compiled them in every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: npm ci
      # Chromium's system libraries kept in the Actions cache, as in
      # engine-integrations.
      - uses: ./.github/actions/system-packages
        with:
          command: npx playwright install-deps chromium
          key: apt-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          prefix: apt-chromium-${{ runner.os }}-${{ runner.arch }}-
      - run: npx playwright install chromium
      - run: cargo build -p supercov
      - run: node scripts/rust-wasm-js.mjs
        env:
          SUPERCOV_REQUIRE_RUST_WASM: "1"
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # Rust tests compiled to wasm, run where Cargo runs them: Node through
  # wasm-bindgen-test-runner, WASI through wasmtime.
  rust-wasm:
    needs: plan
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',rust-wasm,')) && fromJSON(needs.plan.outputs.jobs)['rust-wasm'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy, rustfmt
      # The toolchain's one Rust cache, kept by main; restored only.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Published builds, where `cargo install` compiled them in every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129,wasm-pack@0.15.0
      - name: Install wasmtime 49.0.3
        run: |
          curl -q -sSfL --retry 6 --retry-all-errors --retry-delay 10 https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-x86_64-linux.tar.xz -o "$RUNNER_TEMP/wasmtime.tar.xz" \
            || { echo "SUPERCOV_INFRA_FAILURE=wasmtime could not be fetched" >> "$GITHUB_ENV"; exit 1; }
          tar -xJf "$RUNNER_TEMP/wasmtime.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v49.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - run: cargo build -p supercov
      - run: node scripts/rust-wasm-hosts.mjs
        env:
          SUPERCOV_REQUIRE_RUST_WASM: "1"
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure

  # Not a gate: the tests this run passed only when it ran them again, added
  # to the open issue labelled `flaky-tests` (scripts/flaky-tests.mjs).
  # Nothing here fails the run.
  flaky-tests:
    needs: check
    if: ${{ !cancelled() && needs.check.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: flaky-*
          path: ${{ runner.temp }}/flaky
      - run: node scripts/flaky-tests.mjs report "$RUNNER_TEMP/flaky"
        env:
          GH_TOKEN: ${{ github.token }}

  # The fast tier's answer for this commit, as the `Fast tier` commit status
  # that branch protection requires: every job above passed or was not
  # affected. A status, not this job's check: a label's run of this workflow
  # runs nothing, and a check of the same name from it would stand for the
  # commit. "in full" when every test ran, as a release needs
  # (publish.yml); a run of some jobs by hand (`only`) says nothing.
  verdict:
    name: Fast tier
    needs: [plan, check, bun-bootstrap, launch-arguments, lint, engine-integrations, clang-mcdc-oracle, kotlin-grammar, rust-worker, rust-wasm-js, rust-wasm]
    if: ${{ !cancelled() && inputs.only == '' && !(github.event.action == 'labeled' && github.event.label.name != 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Whether this run was cancelled, and which run set the status last.
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
      - run: node scripts/ci-tiers.mjs report "Fast tier"
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ needs.plan.outputs.mode == 'full' }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
