name: CI

on:
  workflow_dispatch:
  # The gate every change is expected to pass, on the change itself. It ran
  # only when someone remembered to ask for it, which meant a pull request's
  # green tick said the React jobs had passed and nothing
  # about `cargo fmt`, clippy, the workspace tests or the packaged assets.
  pull_request:

permissions:
  contents: read

# A push to a pull request replaces the run of the commit before it. A run started by hand is left
# to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run check

  # The twelve integration scripts that drive the public wrapper, process
  # supervision and every JavaScript runner. They lived only in `test:engine`,
  # which nothing but a release chain runs, so a stale assertion in one of them
  # sat in main through the 1.0.1 release and was found by the 1.1.0 release
  # chain -- the worst moment to find it. They run on the change now.
  engine-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      # The Ruby server gate measures a Puma app; Supercov measures Ruby 3.3
      # and newer, and the runner's own Ruby is older.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The Go server gate builds its server with `go run`.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # The Java server gate compiles its server with `javac`.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Three of the scripts drive a real browser through Playwright.
      - run: npx playwright install --with-deps
      - run: npm run test:engine-integrations

  # The rest of the release check: the steps no other job ran, so a pull
  # request's green tick covers everything a release checks and a release
  # needs no long local run. They ran only in `release:check` on a busy
  # machine, where the timing gates (the watchdog's timeout exit) and the
  # fixtures on fixed ports failed for reasons of their own.
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: npm ci
      - run: npm run test:watchdog
      - run: npm run test:engine-contract
      - run: npm run test:agent
      - run: npm run test:child-attribution
      - run: npm run test:host-loader
      - run: npm run test:native-package
      - run: npm run test:packed-npx
      - run: npm run benchmark:check

  # clang's own MC/DC as the oracle for Supercov's: the golden file was made
  # with Apple's toolchain, which the script finds through `xcrun`.
  clang-mcdc-oracle:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:clang-mcdc
