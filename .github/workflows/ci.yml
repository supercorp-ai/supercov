name: CI

on:
  workflow_dispatch:
  # The gate every change is expected to pass, on the change itself. It ran
  # only when someone remembered to ask for it, which meant a pull request's
  # green tick said the React jobs had passed and nothing
  # about `cargo fmt`, clippy, the workspace tests or the packaged assets.
  pull_request:

permissions:
  contents: read

# A push to a pull request replaces the run of the commit before it. A run started by hand is left
# to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run check

  # The twelve integration scripts that drive the public wrapper, process
  # supervision and every JavaScript runner. They lived only in `test:engine`,
  # which nothing but a release chain runs, so a stale assertion in one of them
  # sat in main through the 1.0.1 release and was found by the 1.1.0 release
  # chain -- the worst moment to find it. They run on the change now.
  engine-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
      # The Ruby server gate measures a Puma app; Supercov measures Ruby 3.3
      # and newer, and the runner's own Ruby is older.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      # The Go server gate builds its server with `go run`.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      # The Java server gate compiles its server with `javac`.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Three of the scripts drive a real browser through Playwright.
      - run: npx playwright install --with-deps
      - run: npm run test:engine-integrations

  # Rust tests compiled to wasm, run where Cargo runs them: Node through
  # wasm-bindgen-test-runner, WASI through wasmtime.
  rust-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: clippy, rustfmt
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install wasmtime 49.0.3
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v49.0.3/wasmtime-v49.0.3-x86_64-linux.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasmtime-v49.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - run: cargo build -p supercov
      - run: node scripts/rust-wasm-hosts.mjs
        env:
          SUPERCOV_REQUIRE_RUST_WASM: "1"
