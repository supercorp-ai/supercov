name: Native artifact matrix

on:
  workflow_call:
    inputs:
      matrix-json:
        description: Exact native target matrix to build for this invocation
        required: false
        type: string
        default: '{"include":[{"runner":"macos-15","target":"aarch64-apple-darwin","package":"supercov-darwin-arm64","executable":"supercov","packedInstall":true},{"runner":"macos-15-intel","target":"x86_64-apple-darwin","package":"supercov-darwin-x64","executable":"supercov","packedInstall":true},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","package":"supercov-linux-arm64-gnu","executable":"supercov","packedInstall":true},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","package":"supercov-linux-x64-gnu","executable":"supercov","packedInstall":true},{"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","package":"supercov-linux-arm64-musl","executable":"supercov","musl":true},{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-musl","package":"supercov-linux-x64-musl","executable":"supercov","musl":true}]}'
      build-targets:
        description: Build selected targets; false verifies only reused artifacts
        required: false
        type: boolean
        default: true
      reuse-run-id:
        description: Optional prior workflow run whose successful target artifacts should be reused
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: inputs.build-targets
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix-json) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # Install matrix targets into the same pinned compiler Cargo selects via
      # rust-toolchain.toml. Installing them into a moving `stable` toolchain
      # leaves the pinned compiler without its target standard library.
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - run: npm ci
      - run: npm run build
      - name: Read package version
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'SUPERCOV_VERSION=' + require('./package.json').version + '\n')"
      - name: Verify Windows npm command invocation before compiling
        if: runner.os == 'Windows'
        run: node scripts/native-package-integration.mjs --npm-preflight
      - name: Build native binary
        if: matrix.musl != true
        run: cargo build --release --target ${{ matrix.target }} -p supercov
      - name: Build static musl binary
        if: matrix.musl
        run: cargo build --config 'target.${{ matrix.target }}.linker="musl-gcc"' --release --target ${{ matrix.target }} -p supercov
      - name: Packed install and real Rust run
        if: matrix.packedInstall
        run: node scripts/native-package-integration.mjs --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }}
      - name: Stage native package
        run: node scripts/package-native.mjs --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --out native-dist
      - name: Pack native package
        # npm 11 treats an unprefixed path containing a slash as a GitHub
        # repository shorthand. `./` makes this unambiguously local.
        run: npm pack ./native-dist/${{ matrix.package }} --pack-destination native-dist --ignore-scripts
      - name: Validate binary, size gate, and checksums
        run: node scripts/native-artifact-check.mjs --target ${{ matrix.target }} --binary target/${{ matrix.target }}/release/${{ matrix.executable }} --tarball native-dist/${{ matrix.package }}-${{ env.SUPERCOV_VERSION }}.tgz --out native-dist/${{ matrix.package }}.checksums.json
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: |
            native-dist/${{ matrix.package }}-${{ env.SUPERCOV_VERSION }}.tgz
            native-dist/${{ matrix.package }}.checksums.json
          if-no-files-found: error

  release-set:
    name: Verify complete native release set
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Download previously validated target artifacts
        if: inputs.reuse-run-id != ''
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.reuse-run-id }}
          github-token: ${{ github.token }}
          pattern: supercov-*
          path: native-release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: supercov-*
          path: native-release
          merge-multiple: true
      - run: node scripts/verify-native-release-set.mjs native-release
      - uses: actions/upload-artifact@v7
        with:
          name: supercov-native-release-set
          path: |
            native-release/*.tgz
            native-release/*.checksums.json
            native-release/release-set.json
          if-no-files-found: error
