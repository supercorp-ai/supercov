name: Windows probe

# Windows can only be proven on a Windows runner: three dependencies compile C
# and assembly in their build scripts and need MSVC, which no other host has,
# and the Windows process supervisor has never been compiled in CI. This builds
# the two MSVC targets through the same steps a release uses -- compile, packed
# install, real coverage run, staging, packing, size and checksum gates -- while
# the release set is not verified, because these targets are held out of it
# with "publish": false until a run here is green.

on:
  workflow_dispatch:
    inputs:
      # While iterating, one architecture is enough: arm64 has failed
      # identically to x64 at every step so far, and each job is a cold
      # release build of the whole engine. Run both only to confirm a fix.
      architectures:
        description: Which Windows architectures to build
        required: false
        type: choice
        default: x64
        options:
          - x64
          - both

permissions:
  actions: read
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/native-artifacts.yml
    with:
      verify-release-set: false
      matrix-json: >-
        ${{ inputs.architectures == 'both'
            && '{"include":[{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","package":"@supercov/cli-win32-x64","artifact":"supercov-cli-win32-x64","executable":"supercov.exe","packedInstall":true},{"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","package":"@supercov/cli-win32-arm64","artifact":"supercov-cli-win32-arm64","executable":"supercov.exe","packedInstall":true}]}'
            || '{"include":[{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","package":"@supercov/cli-win32-x64","artifact":"supercov-cli-win32-x64","executable":"supercov.exe","packedInstall":true}]}' }}
    permissions:
      actions: read
      contents: read
