name: Rust mutation validation

# Supercov's strong pass for Rust against cargo-mutants 27.1.0 on the public
# crates of benchmarks/mutation/rust/corpus.json, on the same runner type
# with the same parallelism: cargo-mutants' outcomes (every mutant, the whole
# suite) in shards, Supercov's `supercov mutants --shard k/n` per crate, its
# shards merged as a split pass merges them, then the agreement and the
# times (wall and CPU, from GNU time). Every job ends within 10 minutes.

on:
  workflow_dispatch:
    inputs:
      crates:
        description: "Space-separated crate names (default: the whole corpus)"
        required: false
        default: ""

permissions:
  contents: read

env:
  # Mutants built and tested at once, by each tool: half the runner's CPUs.
  JOBS: 2
  CARGO_TERM_COLOR: never

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      truth: ${{ steps.plan.outputs.truth }}
      supercov: ${{ steps.plan.outputs.supercov }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          CRATES: ${{ inputs.crates }}
        run: node benchmarks/mutation/rust/summarize.mjs plan >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mutation-rust-supercov
      - run: cargo build --release --bin supercov
      - uses: actions/upload-artifact@v4
        with:
          name: supercov-bin
          path: target/release/supercov

  truth:
    name: cargo-mutants ${{ matrix.crate }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.truth) }}
    steps:
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.140
      - name: Clone
        run: git clone -q --depth 1 --branch "${{ matrix.tag }}" "${{ matrix.repo }}" project
      - name: cargo mutants
        working-directory: project
        run: |
          mkdir -p ../out
          # A mutant that makes a test allocate without end took the runner
          # down with it (base64, shard 10, twice on 2026-11-27) and every
          # outcome of the shard with it. Under a 10 GiB address-space cap the
          # allocation fails instead and the test with it, as on a machine
          # with less memory. Supercov's jobs stop such a test at its time
          # limit, before it holds the runner's memory.
          ulimit -v $((10 * 1024 * 1024))
          # Stopped short of the job's limit, its outcomes so far are kept.
          /usr/bin/time -v -o ../out/time.txt timeout 360 \
            cargo mutants -j "$JOBS" --no-shuffle ${{ matrix.args }} \
            --shard ${{ matrix.index }}/${{ matrix.shards }} --output ../out || echo "exit $?"
          cat ../out/time.txt | head -12
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: truth-${{ matrix.crate }}-${{ matrix.index }}
          path: |
            out/mutants.out/outcomes.json
            out/time.txt

  supercov:
    name: supercov ${{ matrix.crate }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.supercov) }}
    steps:
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - uses: actions/download-artifact@v4
        with:
          name: supercov-bin
          path: bin
      - run: chmod +x bin/supercov
      - name: Clone
        run: git clone -q --depth 1 --branch "${{ matrix.tag }}" "${{ matrix.repo }}" project
      - name: supercov mutants
        working-directory: project
        run: |
          mkdir -p ../out
          # The budget ends the pass in time; what it leaves would show as
          # mutants without a verdict.
          SUPERCOV_STRONG_JOBS="$JOBS" /usr/bin/time -v -o ../out/time.txt \
            ../bin/supercov mutants --shard ${{ matrix.shard }}/${{ matrix.shards }} --budget 360 --json \
            -- ${{ matrix.test }} > ../out/strong.json 2> ../out/strong.log || echo "exit $?"
          head -12 ../out/time.txt; tail -15 ../out/strong.log
          ../bin/supercov runs latest mutants --format jsonl --output ../out/weak.jsonl || true
          cp -r .supercov/runs ../out/runs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: supercov-${{ matrix.crate }}-${{ matrix.shard }}
          include-hidden-files: true
          path: out

  agreement:
    needs: [truth, supercov]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: chmod +x artifacts/supercov-bin/supercov
      - name: Merge, join and summarize
        env:
          CRATES: ${{ inputs.crates }}
        run: node benchmarks/mutation/rust/summarize.mjs report artifacts report | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: agreement
          path: report
