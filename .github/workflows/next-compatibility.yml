name: Next.js compatibility

# A Next.js application with a Vitest suite and a Playwright suite that builds
# and serves the application itself: unit, end to end, then merged. 3.0.4
# failed such an application at two consecutive steps before an end-to-end
# test ran, and nothing here would have said so. One of the two depends on
# the Node version, so both run.
#
# The slow tier's (slow-tier.yml): a pull request ready to merge, every push
# to a release pull request, and each night on main. Whether the change can
# affect the application is the plan's to say.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # The stop-on-failure step cancels this commit's runs.
  actions: write

concurrency:
  group: next-compatibility-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  # Whether this change can affect the job (scripts/ci-affected.mjs), as in
  # CI: the step summary says why it runs or not.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      jobs: ${{ steps.affected.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: affected
        uses: ./.github/actions/affected
        with:
          workflow: next

  application:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.jobs)['application'].run }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The fixture keeps the reporter's Playwright 1.60, which predates the
    # Ubuntu 26.04 that ubuntu-latest is: it fetches and launches the 24.04
    # build of its browser, which runs here.
    env:
      PLAYWRIGHT_HOST_PLATFORM_OVERRIDE: ubuntu24.04-x64
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: tests/fixtures/next-playwright/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: npm ci
        working-directory: tests/fixtures/next-playwright
      # The system's own libraries, by a Playwright that knows this system,
      # from Ubuntu's sources alone and kept between runs.
      - uses: ./.github/actions/system-packages
        with:
          command: env -u PLAYWRIGHT_HOST_PLATFORM_OVERRIDE npx -y playwright@1.62.1 install-deps chromium
          key: apt-chromium-next-${{ runner.os }}-${{ runner.arch }}-1.62.1
          prefix: apt-chromium-next-${{ runner.os }}-${{ runner.arch }}-
      - run: npx playwright install chromium
        working-directory: tests/fixtures/next-playwright
      - run: cargo build -p supercov
      - run: node scripts/next-playwright-integration.mjs
      # A failure here ends this commit's other runs too: no waiting on them.
      - if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/stop-on-failure
