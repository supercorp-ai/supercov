name: Affected jobs
description: >-
  Which of this workflow's jobs a pull request's change can affect, from
  Supercov's own `tests affected` over the Self Coverage run of the newest
  commit the pull request descends from (the map, kept by self-coverage.yml
  on main every three hours and by every full run by hand; the tests of
  every file changed since its commit run too). Every job runs in full on a push,
  a run by hand, a release pull request, a change to how CI runs, and
  whenever there is no map or its answer cannot be trusted. Needs a checkout
  with full history and `actions: read`. The reasons go to the step summary;
  the tests a partial job runs, and the test seconds the jobs deal their
  tests by, to the `affected-selection-<workflow>` artifact.
inputs:
  workflow:
    description: ci, compatibility, self-coverage, next or react
    required: true
outputs:
  jobs:
    description: Each job's {run, mode, matrix, why}, as JSON
    value: ${{ steps.plan.outputs.jobs }}
  mode:
    description: How the run goes (full, map, corpus or skip), before the map is read
    value: ${{ steps.map.outputs.mode }}
runs:
  using: composite
  steps:
    - name: What the pull request changes
      shell: bash
      env:
        MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
      run: |
        changed="$RUNNER_TEMP/changed.txt"
        : > "$changed"
        base=""
        if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
          # The checkout is the merge of the pull request into its base: its
          # first parent is the base, so this is the pull request's change.
          base=$(git rev-parse HEAD^1)
        elif [ "$GITHUB_EVENT_NAME" = merge_group ]; then
          # The merge queue's commit: main as it is now, then each pull
          # request queued before this one, then this one. What it changes
          # is everything since main.
          base="$MERGE_GROUP_BASE"
        fi
        if [ -n "$base" ]; then
          git diff --name-only "$base" HEAD > "$changed" || rm -f "$changed"
          echo "AFFECTED_BASE=$base" >> "$GITHUB_ENV"
        fi
        echo "CHANGED=$changed" >> "$GITHUB_ENV"
    - name: Find the map
      id: map
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mode=$(node scripts/ci-affected.mjs triage "${{ inputs.workflow }}" | jq -r .mode)
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
        [ "$mode" = map ] || exit 0
        base="${AFFECTED_BASE:-$(git rev-parse HEAD^1)}"
        # The newest Self Coverage run whose commit the base holds, with its
        # map kept (main's run every three hours keeps one, and so does a
        # full run by hand): the commits between are ones the map does not
        # know, and `tests affected` reads them as changes.
        found=""
        while read -r id sha; do
          [ -n "$id" ] || continue
          git merge-base --is-ancestor "$sha" "$base" 2>/dev/null || continue
          if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=affected-map" --jq '.artifacts[] | select(.expired | not) | .id' | grep -q .; then
            found="$id $sha"
            break
          fi
        done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow self-coverage.yml --limit 60 \
          --json databaseId,headSha,status --jq '.[] | select(.status == "completed") | "\(.databaseId) \(.headSha)"')
        if [ -z "$found" ]; then
          echo "MAP_REASON=no Self Coverage map of a commit this pull request descends from" >> "$GITHUB_ENV"
          exit 0
        fi
        read -r id sha <<< "$found"
        echo "The map: Self Coverage run $id of $sha ($(git rev-list --count "$sha..$base") commit(s) behind the base)."
        mkdir -p "$RUNNER_TEMP/map"
        if ! gh run download "$id" --repo "$GITHUB_REPOSITORY" -n affected-map -D "$RUNNER_TEMP/map"; then
          echo "MAP_REASON=the map of run $id could not be fetched" >> "$GITHUB_ENV"
          exit 0
        fi
        tar -xzf "$RUNNER_TEMP/map/map.tar.gz" -C .
        chmod +x "$RUNNER_TEMP/map/supercov"
        echo "run=$(cat "$RUNNER_TEMP/map/merged-id")" >> "$GITHUB_OUTPUT"
        echo "MAP_SHA=$sha" >> "$GITHUB_ENV"
        # Every file changed since the map's commit, the pull request's
        # among them: the map, measured on a schedule, can be a few merges
        # old, and a test written in one of these is in no map
        # (scripts/ci-affected.mjs unmapped).
        since="$RUNNER_TEMP/since-map.txt"
        git diff --name-only "$sha" HEAD > "$since" || rm -f "$since"
        echo "SINCE_MAP=$since" >> "$GITHUB_ENV"
        echo "Changed since the map: $(wc -l < "$since" 2>/dev/null || echo '?') file(s)."
    - name: Ask the map
      if: steps.map.outputs.run != ''
      shell: bash
      run: |
        answer="$RUNNER_TEMP/answer"
        mkdir -p "$answer"
        started=$(date +%s)
        run="${{ steps.map.outputs.run }}"
        # The three questions side by side: each reads the map on its own,
        # writes nothing, and took a minute or more of the plan in turn.
        # --names and --files list every test to run, where --json keeps to
        # an agent's budget.
        "$RUNNER_TEMP/map/supercov" runs "$run" tests affected --json > "$answer/affected.json" &
        json=$!
        { "$RUNNER_TEMP/map/supercov" runs "$run" tests affected --names > "$answer/names.txt" || rm -f "$answer/names.txt"; } &
        names=$!
        { "$RUNNER_TEMP/map/supercov" runs "$run" tests affected --files > "$answer/files.txt" || rm -f "$answer/files.txt"; } &
        files=$!
        wait "$json" || true
        wait "$names" || true
        wait "$files" || true
        echo "tests affected answered in $(( $(date +%s) - started )) s"
        jq -c '{summary: .data.summary, workingTree: .data.workingTree, unmeasured: .data.unmeasured, error: .error}' "$answer/affected.json" | head -c 3000; echo
    # Each test's seconds in main's newest Self Coverage runs, which every job
    # of this run deals its tests by (scripts/ci-affected.mjs): the committed
    # .github/test-seconds.tsv goes stale as tests are added, and a test it
    # does not time landed in Self Coverage's first slice, which took twice
    # as long as the others. The most a test took in any of the last three
    # runs: one gate took 4 s in one run and 194 s in the next, and dealt by
    # one run's seconds the slices still ended 12 to 20 minutes apart.
    # Without them, the committed file is used. After the map is asked: the
    # file is not one the map should see changed.
    - name: Fresh test seconds
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        : > test-seconds.tsv
        kept=0
        while read -r id; do
          [ -n "$id" ] || continue
          if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n test-seconds -D "$RUNNER_TEMP/test-seconds/$id" 2>/dev/null; then
            kept=$((kept + 1))
            echo "Test seconds of Self Coverage run $id: $(wc -l < "$RUNNER_TEMP/test-seconds/$id/test-seconds.tsv") test(s)."
            [ "$kept" -lt 3 ] || break
          fi
        done < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow self-coverage.yml --branch main --status success --limit 15 \
          --json databaseId --jq '.[].databaseId' 2>/dev/null || true)
        if [ "$kept" -gt 0 ]; then
          cat "$RUNNER_TEMP"/test-seconds/*/test-seconds.tsv \
            | awk -F'\t' '{ if ($2 > w[$1]) w[$1] = $2; if ($3 > c[$1]) c[$1] = $3 } END { for (n in w) printf "%s\t%.1f\t%.1f\n", n, w[n], c[n] }' \
            | LC_ALL=C sort > test-seconds.tsv
        else
          echo "No Self Coverage run of main kept its test seconds: the committed ones are used."
        fi
        echo "CI_TEST_SECONDS=$PWD/test-seconds.tsv" >> "$GITHUB_ENV"
    - name: Plan the jobs
      id: plan
      shell: bash
      env:
        # A merge group's pull request is read for its title and labels.
        GH_TOKEN: ${{ github.token }}
      run: node scripts/ci-affected.mjs plan "${{ inputs.workflow }}" "$RUNNER_TEMP/answer"
    # Named for the workflow: the slow tier calls several in one run.
    - uses: actions/upload-artifact@v4
      with:
        name: affected-selection-${{ inputs.workflow }}
        path: |
          selection.json
          test-seconds.tsv
        retention-days: 3
